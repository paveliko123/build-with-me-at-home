u set up your own pond and challenge a friend"],"teenTwist":"Add a speedrun timer with best times per level, a seeded level generator with harder patterns, and a stats screen of hops, misses and accuracy.","buildNotes":"Grid-based canvas game loop: rows of pads move at different speeds and wrap around, the frog snaps to grid cells and inherits the pad's speed. Keyboard, swipe and tap controls; best times in localStorage."},{"id":"nature-wildlife-spotter","title":"Wildlife Spotter Journal","pitch":"Tick off the birds, bugs and animals you see outside and collect badges.","kind":"tool","ages":["kid","teen"],"themes":["nature"],"size":"small","howItWorks":"The app shows a nature journal with pages for birds, bugs, garden animals and plants, each with a drawn card. When the user spots something outside, they tap its card to add a sighting with the date and an optional short note like 'on the fence'. Cards turn from grey to full color the first time they are spotted, and badges unlock for things like 'spotted 5 birds' or 'went spotting 3 days in a row'. Users can also add their own card with a name and a simple drawn icon if they see something not on the list.","lookAndFeel":"A paper notebook look with a leafy border, hand-drawn style SVG cards and a warm cream, moss green and bark brown palette. Spotting something plays a soft page-turn sound and a tiny tweet, and badges look like round embroidered patches.","makeItYours":["What is in your journal: birds, bugs, garden animals, or trees and flowers?","Where do you go spotting: the backyard, the park, or from the window?","What badges can you earn: first spot, 10 spots, or a rare find?","What does a new card look like when you spot it: it turns colorful, gets a gold star, or the animal waves?","What is your journal's cover called: My Nature Book, Wild Things, or your own title?"],"levelUp":["A season view that shows which animals you saw in spring, summer, autumn and winter","A spotting challenge of the week chosen from your list","A draw-your-own icon pad for new cards"],"teenTwist":"Turn it into a real citizen-science style logbook with tally charts, most-seen species by month, a sightings-per-day graph and an export of the log as text the user can copy.","buildNotes":"Card grid built from a data array plus user-added cards; sightings stored as a dated list in localStorage. Badges computed from the log; simple SVG or canvas bar chart for the stats."},{"id":"nature-meadow-balance","title":"Meadow Balance","pitch":"Run a meadow where grass grows and rabbits munch, and keep it all in balance.","kind":"learning","ages":["teen"],"themes":["nature"],"size":"medium","howItWorks":"A meadow is shown from above as a grid where grass tiles grow greener over time and little rabbits hop around eating grass and having baby rabbits when well fed. When there is too little grass, hungry rabbits move away to another meadow (they just hop off screen), and too few rabbits lets weeds take over. The user controls rain, sunshine and how many flowers or bushes to plant, and a live line chart shows grass, rabbits and flowers over time. Goals like 'keep 20 to 40 rabbits for 3 seasons' turn it into a puzzle.","lookAndFeel":"A clean top-down grid in shades of green with small white rabbits as rounded shapes with ears, and a side panel with sliders and a chart in calm earth tones. Seasons tint the meadow, and soft Web Audio ticks mark each new season.","makeItYours":["Which grazers live in your meadow: rabbits, deer, or goats?","What can you change: rain, sunshine, planting bushes, or building a pond?","What is the goal: keep it balanced, grow the most flowers, or survive a dry summer?","How fast does time run: slow and watchable, normal, or super fast?","What does the chart show: populations, grass amount, or both?"],"levelUp":["Bees that pollinate flowers and make more flowers grow","Weather events like a dry spell or a wet spring that you must plan for","Save and compare runs with different settings side by side"],"teenTwist":"Expose the simulation rules as editable numbers (growth rate, birth rate, food needed) so the teen can test hypotheses and see how small changes cause boom-and-bust cycles.","buildNotes":"Cellular grid simulation on canvas updated each tick, with agent-based rabbits that look for food. A canvas line chart of population history; settings and best goal results saved in localStorage."},{"id":"nature-plant-care-log","title":"Plant Care Buddy","pitch":"Keep track of when you watered your plants so none of them get thirsty.","kind":"tool","ages":["teen"],"themes":["nature","office"],"size":"small","howItWorks":"The user adds their real or planned plants as cards with a name, a drawn plant icon, and how often it needs water and fertilizer. Each card shows days since last watering and a little plant that droops more as it gets close to watering day; one tap logs 'watered today' and the plant perks up. A 'today' view lists which plants need care, and a history shows each plant's care log. Tips are written by the user themselves, so nothing is looked up online.","lookAndFeel":"A minimal, tidy layout of rounded cards on a light linen background with leafy green accents. Each plant icon is a simple SVG pot with leaves that animate from droopy to upright, with a soft water-drop sound when watered.","makeItYours":["What plants do you have: houseplants, herbs on the windowsill, or a cactus collection?","What should a thirsty plant look like: droopy leaves, a sad face, or a red droplet badge?","What do you track: watering only, also fertilizer, or also turning the pot toward the light?","How should the home screen look: a shelf of pots, a list, or a weekly calendar?","What color style: forest green, terracotta and cream, or dark mode?"],"levelUp":["A calendar heatmap showing every care day","Growth notes where you log new leaves and see a timeline","A vacation planner that shows which plants will need water while you are away"],"teenTwist":"Add scheduling logic that learns each plant's real watering rhythm from the log and suggests the next date, plus streaks and a care-consistency score.","buildNotes":"Card list from a localStorage array of plant objects with a log of dated actions; date math for days since and next due. SVG plant drawing whose droop is driven by a 0 to 1 value."},{"id":"nature-rewild-valley","title":"Rewild the Valley","pitch":"Plant trees, ponds and meadows on a map to bring animals back to the valley.","kind":"game","ages":["teen"],"themes":["nature"],"size":"medium","howItWorks":"A bare, dusty valley is shown as a grid of tiles. Each turn the player gets a few tiles to place (trees, a pond, meadow flowers, a hedge), and each tile scores points based on what is next to it, for example flowers next to a pond attract butterflies, trees next to trees make a forest where owls nest. When certain patterns appear, an animal moves in and shows up on the map. After a set number of turns the valley gets a final score and a star rating, and the player tries to beat their best.","lookAndFeel":"A clean isometric or flat top-down tile map that shifts from beige dirt to rich greens and blues as it fills, with small SVG animals appearing with a little bounce. Placing a tile gives a soft wooden click, and a new animal arriving plays a short gentle melody.","makeItYours":["What kind of place are you rewilding: a valley, an island, or an old city park?","Which tiles can you place: trees, ponds, flowers, hedges, or rocks?","Which animals can come back: butterflies, owls, otters, or deer?","How long is a game: 10 turns, 20 turns, or endless?","How does scoring feel: simple and relaxed, or tricky with combos?"],"levelUp":["Daily puzzle mode with the same starting tiles for everyone on the device","An animal guide page that reveals what each animal needs once discovered","Weather that changes some tiles, like a dry spell shrinking ponds"],"teenTwist":"Make it a real strategy puzzle with adjacency scoring rules shown in a rules page, a seeded tile bag, and a score breakdown after each game.","buildNotes":"Grid of tiles in SVG or canvas with a scoring function that checks neighbors; a tile bag with a seeded random. Turn count, best scores and discovered animals in localStorage."},{"id":"office-lemonade-stand","title":"Lemonade Stand Boss","pitch":"Run your own lemonade stand: make lemonade, pick a price, and sell cups.","kind":"game","ages":["kid"],"themes":["office","nature"],"size":"medium","howItWorks":"Each day starts at the stand with a pretend coin purse. The kid buys lemons, sugar and cups with play coins, picks how many cups to make and a price, then presses Open. Cartoon customers walk by and buy more on hot days and less when the price is too high, and the day ends with a simple picture summary: cups sold, coins earned and a smile meter. After 7 pretend days the kid sees how many coins they made and gets a stand upgrade like a sun umbrella.","lookAndFeel":"A bright, tidy wooden stand drawn in SVG with a striped awning, a big glass pitcher and a pretend weather picture (sunny, cloudy, hot) shown at the start of each day. Customers are simple round characters that walk across, and a cheerful cash-register ding plays for each sale with Web Audio.","makeItYours":["What do you sell: lemonade, smoothies, or cookies?","What is your stand called: Sunny Sips, The Cool Cup, or a name you make up?","What can you buy as an upgrade: a sun umbrella, a bigger pitcher, or a fancy sign?","What kind of pretend money: gold coins, shells, or stars?","How long is the game: 3 days, 7 days, or a whole summer?"],"levelUp":["A recipe mixer where more sugar or ice changes how happy customers are","A second product to sell, like cookies next to the lemonade","A little chart of coins earned each day"],"buildNotes":"A day-based state machine (buy, set price, sell, summary) with a simple demand formula from weather, price and recipe. SVG stand and walking customers with CSS animation; pretend coins and upgrades saved in localStorage."},{"id":"office-post-office-sort","title":"Pretend Post Office","pitch":"Sort the letters and parcels into the right mailboxes before the belt runs out.","kind":"game","ages":["kid"],"themes":["office","cars"],"size":"small","howItWorks":"Letters and little parcels slide along a conveyor belt, each with a colored stamp and a shape (star, heart, circle, square). Mailboxes at the bottom have matching colors and shapes, and the kid drags each item into the right box before it reaches the end of the belt. Each full mailbox gets picked up by a little mail van that drives off with a honk. Fill all the mailboxes to finish the shift and earn a postal badge.","lookAndFeel":"A clean, friendly sorting room with a pale blue wall, a grey moving belt and bright red, yellow, green and blue mailboxes drawn in SVG. Items wobble on the belt, a stamp thunk plays when sorted right, and the van does a happy beep as it leaves.","makeItYours":["How do you sort: by color, by shape, or by number on the letter?","Who picks up the mail: a mail van, a bicycle, or a helpful pigeon?","How fast is the belt: slow and calm, normal, or super speedy?","What do you earn: postal badges, stars, or a shiny new mail cap?","What special mail shows up sometimes: a huge birthday parcel, a glowing letter, or a wobbly box?"],"levelUp":["Stamp-your-own mode where the kid designs stamps with shapes and colors","A level with two belts at once","A delivery mini-game where the van drives letters to little drawn houses"],"buildNotes":"DOM or SVG items moving along a belt with requestAnimationFrame, pointer-event drag and drop into drop zones with matching rules. Web Audio thunk and beep; badges in localStorage."},{"id":"office-chore-spinner","title":"Chore Spinner Chart","pitch":"Spin the wheel to pick a job, do it, and add a sticker to your chart.","kind":"tool","ages":["kid"],"themes":["office"],"size":"small","howItWorks":"The kid (with a grown-up) types or picks a few small jobs with picture icons, like tidy toys, feed the fish, or water the plant. They spin a big colorful wheel that lands on one job; when the job is done they tap Done and place a sticker on their sticker chart. When a row of stickers is full, a little celebration plays and a reward the family chose shows up (written by them, like 'pick the bedtime story'). There are no prizes for spinning itself, only for finishing jobs.","lookAndFeel":"A tidy cork-board look with a big wheel in soft primary colors and a sticker chart grid next to it. The wheel clicks as it spins and slows down, stickers stick with a squishy sound, and a full row sets off confetti.","makeItYours":["What jobs go on the wheel: tidy toys, feed the pet, or set the table?","What stickers do you collect: stars, animals, or smiley faces?","How many stickers make a full row: 3, 5, or 7?","What does the wheel look like: a rainbow, a pizza, or a sun?","What happens when the row is full: confetti, a dance, or a trophy?"],"levelUp":["A week view showing stickers earned each day","A sticker shop where full rows unlock new sticker designs","Two charts for brothers, sisters or friends on the same device"],"buildNotes":"SVG wheel rotated with CSS transform and an ease-out transition to a random job; job list and sticker chart stored in localStorage. Web Audio clicks during the spin."},{"id":"office-shop-cashier","title":"Corner Shop Cashier","pitch":"Be the shop cashier: add up the prices and give the right change.","kind":"learning","ages":["kid","teen"],"themes":["office"],"size":"small","howItWorks":"Friendly customers bring a few items to the counter, each with a price tag. The player adds up the total on a big cash register, then the customer pays with pretend money and the player drags coins and notes from the drawer to give the right change. Getting it right makes the customer smile and leave happy; a mistake shows the right answer kindly with a little hint. Serve 10 customers to finish the shift and see your accuracy stars.","lookAndFeel":"A neat little shop counter with shelves of drawn goods behind (fruit, books, toys), a chunky cash register with big buttons and a drawer of colorful pretend coins and notes. The register goes ka-ching, and coins clink when dragged.","makeItYours":["What kind of shop: a fruit stand, a toy shop, or a bakery?","What pretend money: simple 1, 2, 5 and 10 coins, cents, or a made-up currency like moon coins?","How hard: whole numbers only, bigger totals, or prices with cents?","Who are the customers: animals, robots, or friendly neighbors?","What do you get for a good shift: stars, a shop upgrade, or a cashier badge?"],"levelUp":["A timed rush hour mode with a line of customers","Discounts and coupons like 'half price' to calculate","A shop-owner mode where you set the prices yourself"],"teenTwist":"Add a shop-owner layer with stock, buying prices, selling prices, percentage discounts and a daily profit report.","buildNotes":"Random order generator with item prices, a register keypad for the total, and drag and drop coins with a running change sum. Difficulty settings and best accuracy in localStorage."},{"id":"office-focus-desk","title":"Focus Desk Timer","pitch":"Start a focus timer, and each time you finish, your desk gets a new cool item.","kind":"tool","ages":["kid","teen"],"themes":["office"],"size":"small","howItWorks":"The screen shows an empty, tidy desk and a big timer. The user picks a focus length (like 10, 25 or 45 minutes) and a short break, presses Start, and works on their own task; the timer ring fills calmly. Finishing a focus session adds a new item to the desk, like a lamp, a plant, a pencil cup or a tiny globe, so the desk fills up over time. A log keeps track of sessions and minutes per day.","lookAndFeel":"A calm, minimal desk drawn in SVG in soft wood, sage and off-white tones, seen from the front, with a round progress ring timer above it. A gentle chime plays at the end of a session (made with Web Audio), and new desk items fade in with a small bounce.","makeItYours":["How long is one focus session: 10 minutes, 25 minutes, or your own number?","What gets added to the desk: plants, gadgets, or little pets like a goldfish bowl?","What sound plays at the end: a soft bell, a bird chirp, or a little tune?","What style is the desk: cozy wood, sleek white, or space station?","What do you see during the break: a stretch reminder, a calm breathing circle, or a drawing game?"],"levelUp":["A week chart of focus minutes","Labels for what you focused on, like reading or math, with totals per label","Different rooms to decorate once the desk is full"],"teenTwist":"Turn it into a full study timer with custom work and break cycles, subject tags, daily goals, streaks and a weekly report of minutes per subject.","buildNotes":"Timer based on Date.now differences so it stays accurate if the tab sleeps; SVG progress ring with stroke-dashoffset. Session log and unlocked desk items in localStorage; Web Audio chime."},{"id":"office-typing-inbox","title":"Inbox Zero Typing","pitch":"Type the words on the letters fast to file them before the inbox overflows.","kind":"learning","ages":["kid","teen"],"themes":["office","arcade"],"size":"small","howItWorks":"Paper letters drop slowly into an inbox tray, each showing a word. The player types the word and presses Enter (or it auto-submits when correct), and the letter flies neatly into a filing cabinet. If the inbox gets too full, the shift ends. Levels go from short easy words to longer words and short sentences, and the end screen shows words per minute and accuracy.","lookAndFeel":"A tidy office desk with a wire inbox tray, a grey filing cabinet and paper letters with a slight shadow, in calm blues and greys. Letters swoosh into the drawer with a paper sound, and the typed letters highlight green as you go.","makeItYours":["What are the words: animal names, space words, or your spelling list?","How fast do letters arrive: slow, steady, or rush hour?","What happens when you file a letter: it flies into a drawer, turns into a paper plane, or gets a stamp?","Who is your office buddy cheering you on: a cat, a robot, or a coffee mug with a face?","What is the goal: a top speed, no mistakes, or file 50 letters?"],"levelUp":["A custom word list the user types in, like this week's spelling words","A home-row lesson mode with an on-screen keyboard showing which finger to use","A progress chart of speed over many days"],"teenTwist":"Add real typing trainer stats: words per minute, accuracy, a heatmap of the keys you miss most, and practice drills that focus on those keys.","buildNotes":"Falling items in a DOM or canvas loop, a hidden text input capturing keystrokes and matching against the active word. WPM and accuracy math; word lists and history in localStorage. On touch devices, show the on-screen keyboard input."},{"id":"office-desk-designer","title":"Dream Desk Designer","pitch":"Design your dream office room by dragging in desks, plants and fun stuff.","kind":"creative","ages":["kid","teen"],"themes":["office","robots"],"size":"small","howItWorks":"An empty room is shown with a floor and walls. The user drags in furniture and objects from a catalog (desk, chair, shelves, lamps, plants, rug, a fish tank, a whiteboard, a beanbag), moves and turns them, and changes wall and floor colors. A snapshot button saves a picture of the room drawn by the app itself that is saved into a gallery inside the app. Kids can make a silly office (a slide instead of stairs!) and teens can plan a real study corner.","lookAndFeel":"A flat, front-on room view in clean SVG with soft shadows, in a calm palette the user can switch (Scandinavian white, cozy wood, neon gamer, ocean). Items snap gently onto the floor or wall with a soft click, and the snapshot button makes a camera shutter sound.","makeItYours":["Whose office is it: yours, a robot inventor's, or a secret agent's?","What special item must be there: a slide, a giant aquarium, or a rocket launch button?","What style: cozy and wooden, bright and colorful, or sleek and dark?","How do you see the room: from the front, from the top like a map, or both?","What can you name: the room, the company on the door, or the desk buddy?"],"levelUp":["Day and night lighting with lamps that really glow","Little animated details: a spinning chair, a ticking clock, a swimming fish","A budget mode where each item costs pretend coins and you have a set amount to spend"],"teenTwist":"Add a planning mode with a grid in real centimeters, item sizes, and a checklist for a good study space (light, quiet, storage).","buildNotes":"SVG room with draggable, scalable item groups using pointer events and a z-order list; gallery stores scene JSON (not images) in localStorage and re-renders thumbnails."},{"id":"office-flashcard-boxes","title":"Flashcard Boxes","pitch":"Make your own flashcards and practice until every card moves to the top box.","kind":"learning","ages":["teen"],"themes":["office"],"size":"small","howItWorks":"The user creates decks (like Spanish words or biology terms) and types cards with a front and a back. In practice mode, a card flips with a tap; the user marks it 'got it' or 'not yet'. Cards move up through five boxes when known and back to box 1 when missed, and boxes are reviewed less often the higher they are, so hard cards show up more. A deck screen shows how many cards are in each box and a 'mastered' percentage.","lookAndFeel":"Clean index cards with a subtle paper texture and rounded corners on a calm slate background, with five labeled boxes drawn as little filing drawers. Cards flip with a smooth 3D CSS animation, and a soft tick plays for 'got it'.","makeItYours":["What will you study first: a language, science terms, or history dates?","How do you answer: just flip and self-check, type the answer, or multiple choice made from other cards?","How many boxes: 3 for simple, 5 for classic, or your own number?","What style: paper index cards, dark mode, or bright sticky notes?","What do you get for mastering a deck: a stamp, a streak, or a calm animation?"],"levelUp":["Review days: each box has its own schedule so you know what is due today","Import cards by pasting a list like 'word - meaning' on each line","Stats: cards learned per day and hardest cards"],"teenTwist":"Use a proper spaced repetition schedule (box intervals or a simple ease factor) with a due-today queue and daily review stats.","buildNotes":"Decks and cards stored in localStorage with box number and next-due date; CSS 3D transform card flip. Parsing pasted text into cards with split on lines and a separator."},{"id":"office-savings-goal","title":"Savings Goal Jar","pitch":"Pick something to save for and watch your jar fill up as you add money.","kind":"tool","ages":["teen"],"themes":["office"],"size":"small","howItWorks":"The user creates a savings goal with a name, a target amount they type in and an optional target date. Each time they save, they add an amount they enter themselves, and a drawn jar fills up with coins to show progress. The app calculates how much to save per week to reach the goal on time and shows a simple timeline. Several goals can sit side by side, and nothing connects to any bank or shop: all numbers are typed by the user.","lookAndFeel":"A tidy dashboard with glass jars drawn in SVG that fill with stacked coins, set on a clean white and mint palette with clear numbers. Adding money plays a coin clink and the jar's fill level eases up; hitting the goal sends a burst of confetti.","makeItYours":["What are you saving for: a game, a bike, or a trip fund?","What does the jar look like: a glass jar, a piggy bank, or a treasure chest?","Which currency symbol: dollars, euros, or a made-up one for practice?","Should it show a per-week plan, a per-month plan, or both?","What happens when you reach the goal: confetti, a badge, or a big checkmark?"],"levelUp":["A simple budget page: money in and money out by category, all typed by you","A 'what if' slider: what if I save a little more each week?","A history chart of savings over time"],"teenTwist":"Add a planning model with weekly income you enter, spending categories, a projected goal date, and a pretend interest slider that shows how saving grows over time.","buildNotes":"Goals and dated deposits as JSON in localStorage; date math for weekly targets. SVG jar with a clip-path fill level animated by CSS transition; canvas or SVG line chart for history."},{"id":"office-task-board","title":"Project Task Board","pitch":"Put your tasks on cards and drag them from To Do to Doing to Done.","kind":"tool","ages":["teen"],"themes":["office"],"size":"small","howItWorks":"A board with three columns, To Do, Doing and Done, holds task cards. The user adds cards with a title, an optional due date, a color label (like math, art, chores) and a short checklist. Cards are dragged between columns, overdue cards get a red edge, and a 'today' filter shows what is due soon. A done counter at the top tracks how many tasks were finished this week.","lookAndFeel":"A calm, professional look: light grey board, white cards with soft shadows and colored label stripes, readable sans-serif text. Cards lift slightly while dragging, and moving one to Done plays a satisfying soft click and a tiny check animation.","makeItYours":["What columns do you need: To Do, Doing, Done, or add Waiting and Ideas?","What labels: school subjects, home chores, or a big project like a science fair?","What happens when a card hits Done: a check animation, a sound, or it fades into a done pile?","How do you see dates: a small badge, colored edges, or a separate calendar view?","What style: light, dark, or sticky-note colors?"],"levelUp":["A calendar view of cards with due dates","Several boards, one per project","A weekly review screen showing what you finished and what moved"],"teenTwist":"Add work-in-progress limits per column, time estimates on cards, and a weekly throughput chart, like real project tools use.","buildNotes":"Columns and cards rendered from a localStorage array; drag and drop with pointer events (not only HTML5 drag, so it works on touch). Date comparisons for overdue badges."},{"id":"office-habit-grid","title":"Habit Streak Grid","pitch":"Pick a few good habits and fill in a square each day you do them.","kind":"tool","ages":["teen"],"themes":["office","sports"],"size":"small","howItWorks":"The user adds a few habits they want to build, like read 20 minutes, practice guitar, or stretch. Each habit has a row of day squares for the month; tapping today's square fills it in. The app shows the current streak, the best streak and a percentage for the month, and a year view shows a heatmap of all filled days. Habits are only what the user types; there is no tracking of food, weight or looks.","lookAndFeel":"A crisp grid of rounded squares in a calm palette, each habit with its own color, on a clean white or dark background. Filling a square gives a small pop animation and a soft tone; streak milestones (7, 30 days) show a subtle badge.","makeItYours":["Which habits do you want to track: reading, practicing an instrument, or drinking water?","What does a filled day look like: a colored square, a checkmark, or a little star?","What view do you want first: this week, this month, or the whole year?","Do you want a gentle message for missed days: 'fresh start tomorrow', 'you got this', or none?","What color theme: ocean blues, forest greens, or sunset oranges?"],"levelUp":["Habits that are not daily, like 3 times a week, with the right streak rules","A notes field per day for what you practiced","A stats page comparing habits over the last months"],"teenTwist":"Add a stats dashboard with completion rates per weekday, longest streaks and a year heatmap, helping the teen spot which days are hardest.","buildNotes":"Habits and a set of completed date strings per habit in localStorage; date helpers for streak calculation. CSS grid for the month and year heatmap."},{"id":"office-decision-helper","title":"Decision Helper","pitch":"Stuck between choices? List the good and bad points and see which wins.","kind":"tool","ages":["teen"],"themes":["office"],"size":"small","howItWorks":"The user types a question (like 'which club should I join?') and two to four options. They add the things that matter to them (fun, time, cost, friends, learning) and give each a weight with a slider, then score each option on each thing from 1 to 5. A results view shows a total score for each option with bars and explains which points made the biggest difference. Decisions are saved so they can be looked at again later.","lookAndFeel":"A clean step-by-step layout with numbered cards, calm navy and sand colors, and horizontal bars for scores. Bars grow with a smooth animation in the results, and the winning option gets a subtle highlight rather than a loud celebration.","makeItYours":["What decisions will you use it for: school choices, weekend plans, or what to save for?","How do you score: stars, a 1 to 10 slider, or thumbs up and down?","Should it show a pros and cons list, a scoring table, or both?","What does the result look like: bars, a pie, or a simple ranked list?","Do you want a 'gut check' button that asks how you feel about the winner?"],"levelUp":["A side-by-side compare view for two saved decisions","A sensitivity slider that shows if the winner changes when a weight changes","Templates for common decisions with ready-made criteria"],"teenTwist":"Show a weighted decision matrix with a sensitivity check that reveals which weights would flip the result, a real tool used in planning.","buildNotes":"Form state for options, criteria, weights and scores; weighted sum computed live. SVG or CSS bar chart; saved decisions as JSON in localStorage."},{"id":"princesses-castle-builder","title":"Build a Castle","pitch":"Drag towers, walls and flags to build the castle of your dreams!","kind":"creative","ages":["kid"],"themes":["princesses"],"size":"small","howItWorks":"An empty hill waits under a blue sky, with a tray of castle pieces at the bottom: towers, walls, gates, roofs, windows and flags. Drag pieces onto the hill, tap one to change its color, and pinch or use plus and minus buttons to resize it. Press the star button to save your castle and turn on the lights for a night view.","lookAndFeel":"Chunky, toy-like pieces drawn in SVG with soft shadows, on a green hill with drifting clouds. Pieces snap into place with a little thunk, flags wave gently, and switching to night makes the windows glow and stars appear with a soft twinkle sound.","makeItYours":["Where is your castle: on a hill, on a cloud, or under the sea?","What pieces do you want: towers and walls, bridges and moats, or slides and gardens?","Who lives there: a royal family, a kind dragon, or a group of cats?","What colors are the stones: grey, pink, or rainbow?","What happens when you tap the gate: it opens, a trumpet plays, or a knight waves?"],"levelUp":["A day and night switch with glowing windows and fireworks","Little characters that walk around the castle you built","A gallery of saved castles you can open and change later"],"buildNotes":"SVG pieces with pointer-event drag and drop, a simple grid snap, and a pieces array saved as JSON to localStorage. Web Audio for thunk and trumpet sounds."},{"id":"princesses-crown-designer","title":"Crown Designer","pitch":"Make a sparkly crown and try it on a frog, a cat or a royal knight!","kind":"creative","ages":["kid"],"themes":["princesses"],"size":"small","howItWorks":"A plain crown sits in the workshop. Pick its shape, color and metal, then tap gems and stickers to place them on it. Tap 'try it on' to see the crown on a character you choose, and save your crowns to a royal display shelf.","lookAndFeel":"A cozy jeweler's workshop with a wooden table, drawn in SVG. Gems shine with a small sparkle animation and a clink when placed; the try-on character does a proud little bow.","makeItYours":["Who wears the crown: a frog, a cat, or a brave knight?","What shapes can crowns be: pointy, round, or star-shaped?","What goes on it: gems, flowers, or tiny stars?","What does the character do when crowned: bow, dance, or giggle?","Where are crowns kept: a shelf, a treasure chest, or a glass case?"],"levelUp":["Matching scepters and capes to design too","A crown parade where all saved crowns march by on characters","A surprise button that makes a random wild crown"],"buildNotes":"Layered inline SVG crown with shape presets and click-to-place gem elements; character heads as simple SVG. Save designs as JSON in localStorage; Web Audio for clinks."},{"id":"princesses-jewel-sort","title":"Royal Jewel Sort","pitch":"Sort the shiny jewels into the right treasure chests!","kind":"learning","ages":["kid"],"themes":["princesses"],"size":"small","howItWorks":"A pile of jewels tumbles onto the table, and two or three treasure chests wait below with a picture on each lid (a color, a shape or a number of dots). Drag each jewel into the chest that matches. When the table is empty the chests close, a royal trumpet plays, and the next round mixes it up with a new sorting rule.","lookAndFeel":"Big glossy jewels in SVG (circles, hearts, stars, diamonds) in bright colors, and wooden chests with golden latches. A right drop makes a happy clink and sparkle; a wrong one gently bounces back with a boing, never a scary sound.","makeItYours":["What do you sort: jewels, royal cupcakes, or castle animals?","How do you sort them: by color, by shape, or by counting?","Where do they go: treasure chests, baskets, or dragon nests?","Who checks your work: a friendly king, a wise owl, or a little dragon?","How many chests: two for easy or four for tricky?"],"levelUp":["Counting rounds: put exactly three red jewels in the chest","Two-rule rounds: only blue AND round jewels go here","A sticker book that fills up as you finish rounds"],"buildNotes":"SVG drag and drop with pointer events and drop-zone hit tests; rounds generated from a list of rules (color, shape, count). Web Audio for clinks and trumpets; localStorage for stickers."},{"id":"princesses-moat-hopper","title":"Moat Hopper","pitch":"Hop across the castle moat on lily pads without falling in the water!","kind":"game","ages":["kid"],"themes":["princesses","nature","arcade"],"size":"small","howItWorks":"A little frog in a crown starts on the near bank of the moat. Lily pads, logs and floating barrels drift past in rows, and you tap or press the up arrow to hop forward one row at a time. Reach the castle gate to win the level; land in the water and you splash back to the start with a giggle.","lookAndFeel":"Top-down view on canvas: blue water stripes, green lily pads, brown logs, and the castle gate at the top. The frog wears a tiny gold crown, hops with a squish animation and a boing sound, and splashing makes ripples and a funny plop.","makeItYours":["Who hops: a frog prince, a duckling, or a little knight?","What floats in the moat: lily pads, logs, or rubber ducks?","Where are you going: the castle gate, a garden party, or a treasure island?","How fast do things float: slow and gentle or zippy?","How many hops to win: a short moat or a long one?"],"levelUp":["Shiny coins on some lily pads to collect for a bonus","More levels where the moat gets wider and busier","A friendly fish that pops up and gives you a ride"],"buildNotes":"Canvas grid of lanes with objects moving at lane speeds; the player snaps to grid cells and rides moving objects. Arrow keys and tap or swipe controls; Web Audio boing and plop sounds."},{"id":"princesses-castle-maze","title":"Tower Kitten Rescue","pitch":"Find the keys and get through the castle maze to rescue the kitten in the tower!","kind":"game","ages":["kid"],"themes":["princesses","arcade"],"size":"small","howItWorks":"A young knight starts at the castle door, and a kitten is meowing at the top of the tower. Move through a maze of hallways with arrows or swipes, pick up colored keys, and open doors of the same color. Reach the kitten to finish the level and see a happy hug animation.","lookAndFeel":"A top-down castle maze on canvas with stone floors, rugs and torches drawn as warm orange glows. Keys jingle when picked up, doors creak open, and the kitten gives a cheerful meow at the end.","makeItYours":["Who is the hero: a knight, a princess inventor, or a puppy?","Who needs rescuing: a kitten, a baby dragon, or a lost crown?","What opens the doors: keys, magic buttons, or riddles with pictures?","How big is the maze: tiny, medium, or huge?","What fun things are in the halls: bouncy rugs, sliding floors, or secret doors?"],"levelUp":["A new maze every time, made by the computer","A timer and a best-time trophy","A friendly helper, like a little bird, that flies ahead and points the way"],"buildNotes":"Tile-based grid maze defined by string arrays (or a simple recursive maze generator), canvas rendering, arrow keys plus swipe detection. Web Audio jingle and creak sounds; best times in localStorage."},{"id":"princesses-inventor-tale","title":"The Inventor Princess","pitch":"Help a clever princess invent gadgets to fix problems all over the kingdom.","kind":"story","ages":["kid","teen"],"themes":["princesses","robots"],"size":"medium","howItWorks":"The kingdom has problems: the drawbridge is stuck, the garden is too dry, the dragon cannot sleep. On each page the princess shows the problem, and you choose two or three parts (wheels, springs, a fan, a bell, a pipe) to build a gadget. Some combinations work perfectly, some work in silly ways, and each solved problem adds a gadget to her workshop wall.","lookAndFeel":"Storybook scenes in SVG with a princess in goggles and a tool belt standing in her workshop. Gadget parts snap together on a workbench with clanks and whirs, and silly results (a fan that blows everyone's hats off) play a funny animation.","makeItYours":["Who is the inventor: a princess, a prince, or a royal robot?","What problems need fixing: a stuck drawbridge, a sleepy dragon, or a garden with no water?","What parts can you use: springs and wheels, balloons and fans, or magnets and bells?","Should silly gadgets fail in funny ways or still kind of work?","How many words: just pictures, short sentences, or a longer story?"],"levelUp":["A free-build mode to invent anything with all the parts","A read-aloud button using the device's built-in voice","A kingdom map that lights up each place you have helped"],"teenTwist":"Give parts properties (power, speed, noise) so each problem has requirements, and gadgets succeed by matching them, turning it into a light engineering puzzle with multiple valid answers.","buildNotes":"Scenes and solutions stored as a JS data object; parts as SVG pieces dropped into workbench slots, with outcome lookups for combinations. Progress saved in localStorage; optional speechSynthesis for read-aloud."},{"id":"princesses-tower-stack","title":"Tallest Tower Stack","pitch":"Drop castle blocks to stack the tallest tower you can!","kind":"game","ages":["kid","teen"],"themes":["princesses","arcade"],"size":"small","howItWorks":"A castle block swings back and forth above the tower. Tap to drop it, and whatever part hangs over the edge gets sliced off, so the next block is smaller. Keep stacking as the view scrolls up past the clouds; the game ends when you miss completely, and it shows how tall your tower grew.","lookAndFeel":"Stone blocks with little windows and banners, drawn on canvas against a sky that goes from day to sunset to stars as you climb. Perfect drops flash gold with a bright ding, sliced pieces tumble away, and a flag pops up at your best height.","makeItYours":["What are you stacking: castle blocks, cakes, or books?","What do you see as you climb: clouds, birds, or planets?","Should perfect drops make the block grow back a little?","How fast does it swing: slow, medium, or faster and faster?","What is at the very top: a flag, a crown, or a dragon nest?"],"levelUp":["Special blocks like a bouncy block or a wide golden block","Two players taking turns on the same tower","Height markers like 'higher than a tree' and 'higher than a mountain'"],"teenTwist":"Add a combo system for perfect drops, a speed curve that ramps with height, and a stats screen showing accuracy and longest perfect streak.","buildNotes":"Canvas loop with a horizontally oscillating block; on drop compute overlap with the block below and trim width. Camera offset scrolls upward; Web Audio dings and best height in localStorage."},{"id":"princesses-quest-board","title":"Royal Quest Board","pitch":"Turn your to-do list into royal quests and earn crown stars for finishing them.","kind":"tool","ages":["kid","teen"],"themes":["princesses","office"],"size":"small","howItWorks":"A castle notice board holds quest scrolls. Add a quest with a short name and a picture icon (like a bed for making your bed or a book for reading), and tap it when it is done to stamp it with a royal seal and earn a crown star. Stars fill a tower meter, and a full tower raises a flag and starts a new week.","lookAndFeel":"A wooden board with pinned paper scrolls, each with a big icon so younger kids can use it without much reading. Stamping plays a satisfying thump and a sparkle, and the tower meter fills with gold.","makeItYours":["What do you call the tasks: quests, missions, or royal duties?","What do you earn: crown stars, gold coins, or dragon eggs?","What fills up: a tower, a treasure chest, or a castle garden?","Should quests repeat every day, every week, or only once?","Who cheers when you finish: a herald with a trumpet, a dragon, or a cat in a cape?"],"levelUp":["Separate boards for two players on the same device","Weekly reward ideas a parent can type in","A history page showing finished quests by day"],"teenTwist":"Add priorities, due dates, recurring quests and a weekly review screen with completion stats, so it becomes a real planner wearing a royal costume.","buildNotes":"Quest list as JSON in localStorage with a simple icon picker of inline SVG icons; CSS grid layout. Web Audio for the stamp thump; date logic for daily or weekly resets."},{"id":"princesses-royal-garden","title":"Royal Garden Grower","pitch":"Plant magic seeds in the castle garden and grow brand-new kinds of flowers.","kind":"game","ages":["kid","teen"],"themes":["princesses","nature"],"size":"medium","howItWorks":"The castle garden is a grid of empty flower beds. Plant seeds, water them, and watch them sprout and bloom over a few minutes. When two different flowers bloom next to each other, a new seed sometimes appears that grows a mixed color, and every new kind goes into the royal flower book.","lookAndFeel":"A sunny garden with hedges and a little fountain, drawn in SVG. Flowers grow in stages (sprout, bud, bloom) with a gentle pop animation and a soft chime; the watering can tilts and sprinkles drops.","makeItYours":["What do you grow: flowers, magic mushrooms, or giant vegetables?","Who is the gardener: a princess, a royal gardener knight, or a hedgehog?","How fast do plants grow: in seconds, in minutes, or over real days?","What helps them grow: water, sunshine, or a song?","What is the goal: fill the flower book, win a garden show, or decorate the castle?"],"levelUp":["Garden decorations like fountains, paths and benches","Butterflies and bees that visit when certain flowers bloom","A royal flower show where you pick bouquets to present"],"teenTwist":"Give each flower simple genes (color, petal shape, size) with dominant and recessive rules, so finding rare flowers becomes a breeding puzzle you can plan.","buildNotes":"Grid of SVG plots with plant objects holding growth stage and timestamps; neighbor checks for cross-breeding. Save garden and flower book in localStorage so growth continues between visits."},{"id":"princesses-kingdom-council","title":"Kingdom Council","pitch":"Rule a small kingdom by making choices that keep everyone happy.","kind":"game","ages":["teen"],"themes":["princesses","office"],"size":"medium","howItWorks":"Each turn a citizen or advisor brings a request on a card, like 'build a bridge' or 'hold a festival', and you choose yes or no. Each choice changes four meters: treasury, food, happiness and nature. Keep all four balanced for as many seasons as you can; if any meter runs empty or overflows, the reign ends with a summary of your rule.","lookAndFeel":"A throne room backdrop in SVG with a big card in the center showing the visitor drawn as a simple round character. Four meter icons at the top preview which ones will change when you hover or hold a choice; seasons change the window view and play a short tune.","makeItYours":["What do you rule: a castle kingdom, a floating island, or a forest village?","Which four things do you balance: gold, food, happiness, nature, or your own ideas?","Who brings requests: villagers, animals, or wizards?","How do you choose: swipe left and right, or tap two buttons?","What ends a reign: a meter running out, a set number of seasons, or both?"],"levelUp":["Choices that come back later with consequences","Different rulers with special abilities","A chronicle that remembers the story of each past reign"],"teenTwist":"Design the card deck as a system: conditional cards that only appear after certain choices, hidden long-term effects, and a stats page showing which strategies last longest.","buildNotes":"Card deck as a JSON array with effects and optional conditions; pointer swipe or buttons to choose; meters as CSS bars. Save best reign and chronicle in localStorage; Web Audio for season tunes."},{"id":"princesses-secret-cipher","title":"Royal Secret Cipher","pitch":"Turn messages into secret royal codes and crack codes left for you.","kind":"learning","ages":["teen"],"themes":["princesses","robots"],"size":"small","howItWorks":"Type a message, pick a cipher like a shift code, a symbol alphabet or a keyword code, and watch it turn into secret writing on a parchment scroll. Switch to decode mode to turn a code back into words, or try challenge scrolls where you crack a hidden message using letter clues. Each cipher has a short 'how it works' card with a turning code wheel.","lookAndFeel":"A parchment scroll and a brass code wheel drawn in SVG that rotates as you change the shift. A wax seal stamps the finished message with a thump, and solved challenges unlock new seal designs.","makeItYours":["Which ciphers do you want: shift code, symbol alphabet, or keyword code?","Who are the code makers: royal spies, castle librarians, or messenger owls?","What does the secret writing look like: letters, runes you invent, or little pictures?","How many challenge scrolls to crack: three, ten, or make your own for a sibling?","What do you unlock: new seals, new code wheels, or new scroll colors?"],"levelUp":["A letter-frequency chart that helps crack codes","A challenge maker that saves scrolls for someone else on the same device","A timed code-breaking race"],"teenTwist":"Add a frequency analysis tool and a brute-force view that shows all 26 shifts, so you learn why simple ciphers are easy to break.","buildNotes":"Pure JS string transforms for each cipher, an SVG code wheel rotated with CSS transforms, and a bar chart of letter counts drawn with divs or SVG. Challenges and unlocks in localStorage."},{"id":"princesses-castle-lantern-puzzle","title":"Castle Lantern Puzzle","pitch":"Tap the castle windows to turn all the lights off before bedtime.","kind":"game","ages":["teen"],"themes":["princesses","arcade"],"size":"small","howItWorks":"A castle at night shows a grid of glowing windows. Tapping a window flips it and its neighbors above, below, left and right between lit and dark. The goal is to make every window dark in as few taps as possible, and each level starts with a new pattern.","lookAndFeel":"A tall castle silhouette against a starry sky with warm yellow windows on a grid. Windows flick on and off with a soft click and a curtain animation; when the last one goes dark, an owl hoots and the moon smiles.","makeItYours":["What do you switch off: castle windows, lanterns in a garden, or candles on a cake?","How big is the grid: 3 by 3, 5 by 5, or bigger?","What flips when you tap: neighbors in a plus shape, an X shape, or a whole row?","Do you want a move limit or just a best score?","What happens when you win: the moon smiles, fireworks, or sleepy snores?"],"levelUp":["A hint button that shows one good next tap","Windows with three colors that cycle instead of just on and off","A level maker for your own puzzles"],"teenTwist":"Generate only solvable levels by starting from all-dark and applying random taps, show a par move count, and add a solver hint that explains why the puzzle works.","buildNotes":"2D array state with toggle-neighbors function; generate levels by applying random presses to a solved board so they are always solvable. CSS grid of buttons over an SVG castle; best scores in localStorage."},{"id":"robots-robot-builder","title":"Build-a-Bot","pitch":"Snap together heads, bodies, arms and wheels to make your own robot, then watch it wake up and wiggle!","kind":"creative","ages":["kid"],"themes":["robots"],"size":"small","howItWorks":"The screen shows an empty robot stand in the middle and big picture buttons for head, body, arms and legs around it. Tapping a part button flips through choices, and a paint pot changes each part's color. When the robot is ready, a big power button makes it light up, beep and do a little dance. The finished robot is saved so it is still there next time.","lookAndFeel":"Each part is a simple SVG shape: square heads with antennas, round heads with one big eye, tank tracks, springy legs, claw or noodle arms. A friendly workshop scene with a pegboard wall, bright primary colors and blinking chest lights. Every snap plays a soft click and the power button plays a rising beep-boop tune made with Web Audio.","makeItYours":["What kind of robot do you want to build: a helper bot, a silly bot, or a super-strong bot?","What should its eyes look like: one big eye, two round lights, or a screen with a face?","How does it move: wheels, tank tracks, or springy jumping legs?","What happens when you press the power button: it dances, it waves, or it blows bubbles?","What colors does your workshop have: shiny silver, rainbow, or dark with glowing lights?","What is your robot's nickname: Bolt, Zippy, or something you make up?"],"levelUp":["A gallery shelf that keeps up to six saved robots you can pick and change","Stickers and accessories like hats, capes and jet packs","A random-robot button that mixes parts for a surprise"],"buildNotes":"Inline SVG with each part as a group swapped by index; CSS keyframe animations for the wake-up dance; Web Audio oscillator beeps; localStorage stores the chosen parts and colors."},{"id":"robots-battery-catch","title":"Battery Catch","pitch":"Slide your robot left and right to catch falling batteries before its power runs out!","kind":"game","ages":["kid"],"themes":["robots","arcade"],"size":"small","howItWorks":"A robot with a big basket head stands at the bottom of the screen and its power bar slowly drains. Batteries fall from the sky and catching one fills the bar, while catching a raindrop makes the robot fizz and lose a little power. The game gets a bit faster over time, and when the power bar hits zero the robot takes a nap and you see your score and best score.","lookAndFeel":"The robot is drawn on canvas with a round body, a basket head and glowing cheeks that get brighter as power goes up. Background is a cozy city rooftop at sunset, batteries are green with a lightning mark, raindrops are blue. Catching plays a happy zap, raindrops play a silly fizz, and the nap ends with a sleepy beeping snore.","makeItYours":["What falls from the sky for your robot to catch: batteries, cookies, or shiny bolts?","What should the robot avoid: raindrops, mud blobs, or grumpy clouds?","Where does the game happen: on a rooftop, on the moon, or in a toy shop?","How fast should it get: gentle and slow, medium, or super speedy?","What does your robot say when it catches something: zap, yum, or beep beep?"],"levelUp":["Golden power-ups that make the basket wider for a few seconds","Different robots to pick, unlocked by reaching score milestones","A two-player mode where each player steers a robot on half the screen"],"buildNotes":"Canvas game loop with requestAnimationFrame; pointer and touch drag plus arrow keys to move; simple rectangle collision; Web Audio for zap and fizz; localStorage for best score."},{"id":"robots-blinky-lights","title":"Blinky Light Copycat","pitch":"Watch the robot's lights blink in a pattern, then tap them in the same order!","kind":"game","ages":["kid"],"themes":["robots","music"],"size":"small","howItWorks":"A big robot shows four colored lights on its chest. It blinks a short pattern, each light with its own beep, and the player taps the lights to copy it. Every correct round adds one more blink to the pattern, and a mistake makes the robot giggle and show how far you got. It works without reading because everything is colors and sounds.","lookAndFeel":"A tall friendly robot fills the screen, drawn in SVG, with four large round chest buttons in red, yellow, green and blue that glow when lit. Its face smiles wider as the pattern grows. Each light plays its own musical note made with Web Audio, and a short victory jingle plays on new best rounds.","makeItYours":["How many lights should your robot have: three for easy, four, or six for tricky?","What sounds should the lights make: piano notes, beeps, or animal sounds made of beeps?","What happens when you make a mistake: the robot giggles, sneezes, or spins around?","What shape are the lights: circles, stars, or hearts?","Should the robot get faster as you go: yes, a little bit, or never?"],"levelUp":["A free-play mode where kids tap the lights to make their own songs","A reverse mode where you repeat the pattern backwards","A trophy shelf showing best rounds for each difficulty"],"buildNotes":"SVG buttons with pointer events; a pattern array grown each round and played back with setTimeout; Web Audio oscillators tuned to notes; localStorage for best round per difficulty."},{"id":"robots-robot-pet","title":"Robot Pet Buddy","pitch":"Take care of a little robot pet: charge it, oil its gears and play with it to keep it happy!","kind":"game","ages":["kid"],"themes":["robots"],"size":"small","howItWorks":"A small robot pet lives in a room and has three meters shown as pictures: battery, oil and fun. The meters slowly go down, and the player taps big buttons to plug it in, give it a drop of oil or throw it a ball. The robot's face changes from sad to happy depending on its meters, and it learns a new trick every day you visit.","lookAndFeel":"The pet is a round SVG robot with a screen face that shows happy, sleepy or wobbly expressions and a wagging antenna. A soft room with a charging pad, an oil can and a toy box, in calm pastel metal colors. Charging makes a rising hum, oil makes a squeaky-then-smooth sound, and happy moments play a cheerful chirp.","makeItYours":["What kind of pet robot is it: a robo-puppy, a robo-cat, or a robo-dino?","What toy does it love to play with: a ball, a laser dot, or a spinning top?","What trick can it learn: a backflip, a spin, or a song?","What does its room look like: a garage, a cozy bedroom, or a space station?","What nickname do you want to give your robot pet: Sprocket, Beepo, or your own idea?"],"levelUp":["A wardrobe of hats and paint colors earned by keeping it happy several days in a row","A sleep mode with a night-time room and twinkling lights","A mini-game inside the toy box, like catch the ball"],"buildNotes":"SVG character with expression states; meters that decay based on time since last visit stored in localStorage; CSS animations for tricks; Web Audio for hums and chirps. Keep meters gentle so the pet never gets sick or upset, only sleepy."},{"id":"robots-dance-party","title":"Robot Dance Party","pitch":"Make your robot dance by tapping moves, then press play to watch your dance with music!","kind":"creative","ages":["kid"],"themes":["robots","music"],"size":"small","howItWorks":"A robot stands on a disco stage with a row of big move buttons below it: arms up, spin, jump, wiggle, and robot walk. Tapping a move makes the robot do it right away and also adds it to a dance strip at the bottom. Pressing play runs the whole dance in order with a looping beat, and the dance is saved so you can show it later.","lookAndFeel":"A boxy SVG robot with jointed arms and legs that move with CSS transforms. A stage with a checkered floor, colored spotlights that sweep and a glowing speaker. A simple drum beat and bass loop made with Web Audio play during the dance, and each move has its own sound effect like a whoosh or a boing.","makeItYours":["What dance moves should your robot know: the spin, the moonwalk, or the noodle arms?","What music style do you want: fast and bouncy, slow and groovy, or silly kazoo beeps?","Where is the dance party: a disco, a junkyard, or on top of a rocket?","Who else joins the party: a tiny drone, a dancing toaster, or nobody?","What colors should the spotlights be: rainbow, blue and purple, or gold?"],"levelUp":["A speed slider to make the dance slow or super fast","A second robot that copies the first one, one beat later","Several saved dances with picture names"],"buildNotes":"SVG robot with transform-origin on each limb; moves defined as small keyframe sequences; Web Audio scheduler for a looping beat; localStorage for saved dance sequences."},{"id":"robots-code-the-robot","title":"Code the Robot","pitch":"Give your robot arrow commands to walk through a maze and reach its charging station!","kind":"learning","ages":["kid","teen"],"themes":["robots"],"size":"small","howItWorks":"A grid board shows a robot, some walls and a glowing charging station. The player taps arrow cards (forward, turn left, turn right) to build a list of commands, then presses Go and the robot follows them step by step. If it bumps a wall it says oops and goes back to the start, and reaching the charger finishes the level and unlocks the next one. Levels get trickier with more turns and spare batteries to collect.","lookAndFeel":"A clean top-down grid like a workshop floor with bolts as decoration, the robot drawn as a cute square bot with an arrow-shaped face so you can see where it is facing. Commands appear as colorful chunky cards. Each step makes a little clank, bumping a wall makes a soft boing, and finishing plays a victory beep tune with confetti sparks.","makeItYours":["What is your robot trying to reach: its charger, a pile of cookies, or its robot friend?","What is in the way: walls, puddles, or sleeping cats?","How many levels should there be: five easy ones, ten, or a level maker?","What does the robot do when it wins: a spin, fireworks, or a happy song?","What does the floor look like: a factory, a garden, or a moon base?"],"levelUp":["A repeat card that loops a group of commands a set number of times","A level editor where you place walls and goals and save your own puzzles","Stars for solving a level with the fewest commands"],"teenTwist":"Add repeat loops, a reusable function card and a fewest-commands score so solving each level becomes a real optimization puzzle like writing short code.","buildNotes":"Grid stored as a 2D array; command list executed with a step timer and animated SVG or canvas movement; levels as JSON inside the page; localStorage for unlocked levels and best command counts."},{"id":"robots-lost-robot-trip","title":"Little Robot Goes Home","pitch":"Help a small lost robot choose which way to go on its trip back home!","kind":"story","ages":["kid","teen"],"themes":["robots","nature"],"size":"small","howItWorks":"Each page of the story shows a picture scene and a short sentence, with two or three big choice buttons with icons. Choices lead to different places like a windy forest, a busy factory or a quiet lake, and some choices help new friends along the way. There are several different endings, and an ending map shows which ones you have found so far.","lookAndFeel":"Simple storybook scenes drawn with SVG shapes and soft gradients, and the little robot with a single blinking eye and a leaf stuck on its antenna. Gentle warm colors, with each place having its own palette. A soft ambient tone plays in each scene and a cheerful chime plays when you find a new ending.","makeItYours":["Why is the robot lost: it rolled off a truck, it followed a butterfly, or a storm blew it away?","Where is its home: a toy shop, a lighthouse, or a farm?","What friend does it meet on the way: a curious owl, a rusty old tractor, or a lost kite?","How should the story be told: with pictures and a few words, or with longer sentences?","What is the happiest ending: a big welcome party, a new best friend, or a shiny new paint job?"],"levelUp":["A tiny item backpack where things you pick up open new choices later","A read-aloud style mode with a different beep melody for each character","A story-maker mode where you write your own page and choices"],"teenTwist":"Add hidden variables like battery level and trust that change which choices appear, and let the teen write and branch their own chapters in a simple editor.","buildNotes":"Story stored as a JSON object of scenes with choices pointing to scene ids; SVG scene drawings composed from reusable shapes; localStorage for found endings; Web Audio for chimes."},{"id":"robots-gear-garden","title":"Gear Garden","pitch":"Place gears on pegs so they turn each other and spin the big wheel to make the flowers bloom!","kind":"game","ages":["kid","teen"],"themes":["robots","nature"],"size":"medium","howItWorks":"Each level shows a board of pegs, a motor gear on one side and a goal wheel on the other. The player drags gears of different sizes from a tray onto the pegs, and gears that touch turn each other in opposite directions. When the chain reaches the goal wheel and it spins the right way, flowers bloom and the level is done.","lookAndFeel":"Shiny brass and copper gears drawn as SVG with real teeth, spinning smoothly when connected. A garden workshop background with vines growing around metal pipes. A soft ticking sound plays while gears turn, wrong-direction spins make a grumpy clunk, and success plays a sparkly bloom sound.","makeItYours":["What happens when the big wheel spins: flowers bloom, a robot wakes up, or a fountain turns on?","What should the gears look like: shiny metal, candy colors, or wooden?","How many gear sizes are in the tray: two, three, or four?","Should there be a time limit: no, a gentle one, or a speed challenge?","Where is the machine: in a garden, in a clock tower, or inside a giant robot?"],"levelUp":["Goals that need a certain speed, not just a direction","Blocked pegs and fixed gears that make puzzles trickier","A free build sandbox to make giant gear machines"],"teenTwist":"Show gear ratios and turning speed numbers, and add levels that require an exact output speed so the teen has to plan gear trains like an engineer.","buildNotes":"SVG gears generated from tooth count; connection detection by distance between pegs and radii; direction and speed propagated through a graph search; pointer-based drag and drop with snapping; localStorage for level progress."},{"id":"robots-junkyard-jump","title":"Junkyard Jumper","pitch":"Run and jump your robot over boxes and puddles to collect shiny bolts!","kind":"game","ages":["kid","teen"],"themes":["robots","arcade"],"size":"small","howItWorks":"The robot runs automatically through a side-scrolling junkyard, and the player taps or presses space to jump over crates, puddles and tires. Bolts float in the air to collect, and they can be spent in a parts shop at fixed prices for things like springier legs or a new paint color. Bumping into a crate ends the run with a funny clang, and you see your distance and best distance.","lookAndFeel":"A canvas scene with layers that scroll at different speeds: far piles of junk, a sunset sky and the ground with stacks of old tires. The robot has spring legs that squish when it lands and a little puff of steam. Jumps make a boing, bolts make a ting, and the shop plays a cheerful little jingle.","makeItYours":["Where does your robot run: a junkyard, a candy factory, or a snowy mountain?","What does it collect: bolts, gems, or batteries?","What can it buy in the shop: springy legs, a jet pack, or a new color?","What stops the run: bumping a crate, falling in a puddle, or running out of fuel?","Should it have a double jump: yes, only after buying it, or no?"],"levelUp":["Day and night that changes as you run further","A jet pack power-up that lets you fly for a few seconds","Special challenge runs like collect 50 bolts without jumping on puddles"],"teenTwist":"Add an upgrade tree with trade-offs, like heavier armor that survives one bump but makes jumps shorter, so spending bolts becomes a strategy.","buildNotes":"Canvas game loop with gravity and jump velocity; parallax background layers; obstacle spawner with rising speed; localStorage for bolts, upgrades and best distance; shop items have fixed prices, no random rewards."},{"id":"robots-factory-line","title":"Robot Factory Line","pitch":"Build a factory with conveyor belts and sorters that route robot parts to the right boxes.","kind":"game","ages":["teen"],"themes":["robots","office"],"size":"medium","howItWorks":"A grid factory floor has spawners on one side that send out parts (heads, wheels and arms, in different colors) and labeled shipping boxes on the other. The player places conveyor tiles, turning tiles and sorter tiles that route parts by shape or color, then presses Run to watch the line work. A level is solved when each box gets the right parts, and the score counts how few tiles you used and how fast it finished.","lookAndFeel":"Top-down industrial style with dark gray floor, yellow hazard stripes and animated belts that scroll. Parts are small colorful icons that glide along the belts. Belts hum, sorters click and wrong deliveries make a buzzer sound, while a finished order plays a satisfying stamp sound.","makeItYours":["What does your factory make: robots, toy cars, or cupcakes?","What special tiles should exist: a sorter by color, a splitter, or a painter that changes color?","How is a level scored: fewest tiles, fastest time, or both?","What does the factory look like: gritty and industrial, clean and futuristic, or cartoony?","What happens when an order is done: a truck drives off, fireworks, or a stamp says shipped?"],"levelUp":["A sandbox mode with unlimited tiles to build big factories","Assembler tiles that combine a head, body and wheels into a full robot","A level editor that saves custom puzzles on the device"],"teenTwist":"Sorters act like if-then rules and splitters like loops, so designing a line is basically visual programming, with an efficiency leaderboard of personal bests per level.","buildNotes":"Grid of tile objects with directions; a tick-based simulation that moves items one cell per tick; canvas rendering with simple belt animation; levels as JSON; localStorage for best scores and saved designs."},{"id":"robots-binary-beeper","title":"Robot Secret Code","pitch":"Turn your messages into robot language with blinking lights, beeps and ones and zeros.","kind":"tool","ages":["teen"],"themes":["robots","office"],"size":"small","howItWorks":"The user types a short message and the tool shows it in robot code: binary bits as rows of lights, plus a Morse code version that a robot can beep out loud. A play button flashes the lights and plays the beeps at an adjustable speed. A decode mode lets the user tap in lights or dots and dashes to turn code back into words, and a practice mode quizzes you on letters.","lookAndFeel":"A sleek robot console with a dark panel, rows of round LED lights that glow green or amber, and a small robot head that reads the message aloud in beeps. Monospace-looking text drawn with system fonts. Beeps are generated with Web Audio, with short and long tones for Morse and two pitches for binary.","makeItYours":["Which code should come first: binary lights, Morse beeps, or a made-up robot alphabet?","What does the robot console look like: retro green screen, shiny chrome, or neon?","How should practice mode work: quiz on letters, decode a secret word, or a timed challenge?","What sound should the beeps have: soft whistles, classic radio beeps, or bloopy bubbles?","Should there be a cipher too: a letter shift code, a reverse code, or none?"],"levelUp":["A letter-shift cipher with a dial to pick the secret number","A saved notebook of coded messages on this device","A speed challenge that tracks how fast you can decode"],"teenTwist":"Show how each letter becomes a number and then bits, add hex and a shift cipher, and turn the decoder into a puzzle where you crack a message without knowing the shift.","buildNotes":"Text-to-char-code conversion with toString(2) padded to 8 bits; a Morse lookup table; Web Audio oscillator scheduling for tones; CSS glow for LEDs; localStorage for saved messages and practice scores."},{"id":"robots-sumo-bots","title":"Bumper Bot Ring","pitch":"Two players each steer a bumper robot and try to nudge the other one out of the ring!","kind":"game","ages":["teen"],"themes":["robots","sports"],"size":"small","howItWorks":"Two round robots sit in a circular ring seen from above, one steered with WASD and the other with the arrow keys, or with on-screen buttons on each side for a tablet. Robots have momentum and bounce off each other with simple physics, and a short dash move gives an extra push but needs a few seconds to recharge. Pushing the other robot out of the ring wins the round, and the first to three rounds wins the match.","lookAndFeel":"A glowing arena ring on a dark floor, robots drawn on canvas as round bumpers with a face and a colored stripe for each player. Little sparks fly when they bump, and the ring edge flashes when someone gets close. Bumps make a rubbery thud, dashes make a whoosh and the round win plays a crowd-like cheer made from noise and tones.","makeItYours":["What do the robots look like: round bumper cars, square boxes, or bouncy blobs?","What special move do they have: a dash, a short shield, or a magnet pull?","What shape is the ring: a circle, a square, or one that slowly shrinks?","How many rounds win the match: one, three, or five?","What happens on the floor: nothing, slippery ice patches, or bouncy pads?"],"levelUp":["A computer-controlled robot for one-player practice","Robot stats to choose before the match, like heavy and slow versus light and fast","Arena hazards like a spinning bar in the middle"],"teenTwist":"Give each robot tunable stats like mass, acceleration and dash cooldown with a fixed point budget, so building the robot is as important as driving it.","buildNotes":"Canvas loop with velocity, friction and circle-circle collision response using mass; keyboard handling for two players plus touch buttons; Web Audio for thuds and whooshes; localStorage for match records. Cartoon bumping only."},{"id":"space-star-catcher","title":"Star Catcher","pitch":"Slide your little rocket to catch falling stars and dodge the space rocks.","kind":"game","ages":["kid"],"themes":["space","arcade"],"size":"small","howItWorks":"A small rocket sits at the bottom of a starry sky. Stars and the odd space rock drift down from the top, and you drag or arrow-key the rocket left and right to catch the stars. Each star adds a point, a rock bonks you and costs one of three hearts. The game gets a little faster every ten stars, and your best score is remembered.","lookAndFeel":"A round, friendly rocket drawn with simple shapes and a flickering orange flame, on a deep navy sky with tiny twinkling dots. Stars are bright yellow with a soft glow and sparkle when caught, rocks are grey lumpy circles. Each catch plays a happy rising ding, and a bonk plays a soft wobble sound.","makeItYours":["Who flies the rocket: an astronaut, a cat, or a little alien?","What do you catch: stars, glowing moon cookies, or tiny planets?","What should you dodge: space rocks, grumpy clouds, or bouncing space socks?","How many hearts do you get: three, five, or unlimited for an easy mode?","What color is the sky: dark blue, purple, or deep black with a pink glow?"],"levelUp":["Add a rare golden star that gives a shield for a few seconds.","Add three levels with different backgrounds that unlock as your score grows.","Add a rocket picker where new rocket colors unlock at score goals."],"buildNotes":"Canvas game loop with requestAnimationFrame, falling objects in an array with simple box collision, pointer and keyboard controls, best score in localStorage, Web Audio beeps for catch and bonk."},{"id":"space-gentle-landing","title":"Gentle Moon Landing","pitch":"Use your rocket booster to land softly on the landing pad without crashing.","kind":"game","ages":["kid","teen"],"themes":["space"],"size":"small","howItWorks":"A lander falls slowly toward a bumpy ground with one flat glowing landing pad. Holding the booster button or space bar pushes it up and uses fuel, and left and right nudge it sideways. Touch the pad slowly enough and you land with a cheer; come in too fast and you get a cartoon bounce and a try again. Each level moves the pad and gives you a little less fuel.","lookAndFeel":"A boxy lander with four little legs and a puffy flame, over grey cratered hills drawn as a jagged line. A speed meter turns green, yellow, or red so you can see if you are going too fast. The booster hums while held, and a soft landing plays a short victory tune with confetti stars.","makeItYours":["Where do you land: the Moon, Mars, or a made-up candy planet?","Who is inside the lander: a robot, a dog astronaut, or you?","How easy is it: lots of fuel, just enough, or super tricky?","What happens when you land: confetti, a flag goes up, or aliens wave hello?","What color is the ground: grey, rusty red, or bright purple?"],"levelUp":["Add a world picker where each place has different gravity, like the Moon being much gentler than Earth.","Add a level with a moving landing pad or a small cave to fly into.","Add stars for how much fuel you saved, shown on a level map."],"teenTwist":"Use real gravity ratios (the Moon is about one sixth of Earth, Mars about three eighths), add a side wind, and score landings on fuel left and touchdown speed with a best run per world.","buildNotes":"Canvas loop with velocity and gravity per frame, thrust as upward acceleration, ground as a polyline with a flat pad segment, landing check on vertical and horizontal speed, Web Audio oscillator for the booster hum, best results in localStorage."},{"id":"space-planet-parade","title":"Planet Parade","pitch":"Put the planets in the right line from the Sun and hear a fun fact about each one.","kind":"learning","ages":["kid"],"themes":["space"],"size":"small","howItWorks":"The Sun glows on the left with eight empty spots in a row, and the eight planets sit mixed up at the bottom. You drag each planet to the spot where you think it goes, and it snaps in if right or gently floats back if not. Tapping any planet shows its name and one short fact, like Jupiter being the biggest. When all eight are in line, the planets start to circle and a celebration plays.","lookAndFeel":"Big round planets drawn with SVG gradients: a ringed Saturn, a striped Jupiter, a blue and green Earth. A dark sky with a warm yellow Sun and very few words, large and easy to read. Each correct snap plays a note, and the finished parade plays all eight notes as a little tune.","makeItYours":["Should the planets have faces: happy faces, sleepy faces, or no faces?","Who gives the facts: a talking star, a robot helper, or the Sun itself?","What happens at the end: planets dance, fireworks, or a rocket flies past?","Should it show words, or only pictures and sounds for younger kids?","Add a dwarf planet as a bonus friend: Pluto, or no bonus?"],"levelUp":["Add a second game: sort the planets from smallest to biggest.","Add a quiz mode with three picture choices per question.","Add a sticker book that fills up as you learn each planet's fact."],"buildNotes":"SVG or absolutely positioned divs with pointer-event drag and drop, snap zones checked by distance, a small facts array using well-known facts only, Web Audio notes, finished state saved in localStorage."},{"id":"space-moon-phase-wheel","title":"Moon Phase Wheel","pitch":"Move the Moon around the Earth and watch how its shape changes in the sky.","kind":"learning","ages":["kid","teen"],"themes":["space","nature"],"size":"small","howItWorks":"On the left, a top-down view shows the Sun's light coming from one side, the Earth in the middle, and the Moon on a circle around it. You drag the Moon around its path (or use a slider), and on the right a big window shows what the Moon looks like from Earth right then, with the phase name like new moon, crescent, half, gibbous, or full. A small challenge mode shows a Moon shape and asks you to drag the Moon to the matching spot.","lookAndFeel":"A clean night-sky look with the Moon drawn as a grey circle and its shadow drawn by a moving curved SVG path. The Sun's rays are soft yellow lines from one side. A gentle chime plays when you reach each of the main phases.","makeItYours":["Who watches the Moon from Earth: an owl, a kid on a rooftop, or a sleepy cat?","Should the Moon have a face that smiles when it is full?","Do you want a challenge mode, a just-explore mode, or both?","What colors: classic night blue, purple dream, or black and silver?","Should it show the day count across the month, about 29 and a half days?"],"levelUp":["Add a play button that runs a whole month as a smooth animation.","Add a moon diary where you tap the shape you saw tonight and it saves a calendar.","Add a quiz with a score that is remembered."],"teenTwist":"Add a day counter for the roughly 29.5-day cycle, waxing and waning labels, and a note on when each phase is up in the sky (full moon rises around sunset, new moon is up during the day).","buildNotes":"SVG for both views, angle from pointer position with Math.atan2, phase shading drawn as two arcs whose curve depends on cos(angle), Web Audio chime, localStorage for quiz best and diary."},{"id":"space-alien-friend-maker","title":"Make an Alien Friend","pitch":"Build your own funny alien by picking eyes, colors and antennas, then give it a name.","kind":"creative","ages":["kid"],"themes":["space","robots"],"size":"small","howItWorks":"A blank blob alien stands on a little planet in the middle of the screen. Big picture buttons let you choose body shape, color, how many eyes, mouth, antennas, and arms. You type or pick a silly name, then press save to add it to your alien gallery, where all your aliens wave and bounce.","lookAndFeel":"Everything is drawn in SVG with thick outlines and bright, friendly colors. Each part pops on with a boing sound, and the alien blinks and wiggles now and then. The gallery is a row of tiny planets, one alien standing on each.","makeItYours":["What body shapes can aliens have: blob, star, or jelly bean?","How many eyes can they have: one, three, or up to ten?","What sound does your alien make when tapped: a giggle, a beep, or a boing?","Where do aliens live: on a planet, in a flying saucer, or on a comet?","Should there be a random button that makes a surprise alien?"],"levelUp":["Add hats and accessories like a bow, a helmet, or sunglasses.","Add a dance button where all the aliens in the gallery dance together.","Let aliens get a favorite food and a short sentence about themselves."],"buildNotes":"SVG built from parts chosen by index, picker buttons as small SVG previews, gallery as an array of choice objects in loc
