alStorage, Web Audio boing with a quick pitch slide."},{"id":"space-connect-the-stars","title":"Connect the Stars","pitch":"Tap stars to join them with glowing lines and make your own picture in the sky.","kind":"creative","ages":["kid","teen"],"themes":["space"],"size":"small","howItWorks":"A night sky full of scattered stars fills the screen. You tap one star, then another, and a glowing line joins them, so you can draw any shape you like: a dragon, a rocket, a teacup. When you are happy you give your star picture a name, and it is saved in your sky book where you can open it again or start fresh with a new sky.","lookAndFeel":"Stars are small soft-glowing dots of different sizes on a deep blue to black gradient. Lines fade in like light trails, and finished pictures gently pulse. Each tap plays a little sparkly bell note, so drawing a shape plays a tiny melody.","makeItYours":["What color are the lines: gold, ice blue, or rainbow?","How many stars in the sky: a few big ones, or lots of tiny ones?","What sound plays as you connect stars: bells, a harp, or a soft hum?","Can you add your own stars by tapping empty sky?","What do saved pictures do: twinkle, slowly spin, or float across the sky?"],"levelUp":["Add a guess mode for two people on the same device: one draws, the other guesses.","Add a few famous star patterns, like the Big Dipper, to trace.","Add a slow night that moves the whole sky across the screen."],"teenTwist":"Add a trace mode with a handful of well-known patterns (Big Dipper, Orion's belt, Cassiopeia's W) plus an undo, a line-thickness tool, and a mirror mode for symmetric designs.","buildNotes":"Canvas or SVG with stars generated from a seed so a sky can be saved and reloaded, lines as pairs of star indexes, nearest-star hit testing for taps, sky book in localStorage, Web Audio notes chosen from a pentatonic scale."},{"id":"space-rock-zapper","title":"Space Rock Zapper","pitch":"Tap the space rocks to zap them before they bump into your space station.","kind":"game","ages":["kid"],"themes":["space","arcade"],"size":"small","howItWorks":"A round space station sits in the middle of the screen, and space rocks slowly drift in from every side. You tap or click a rock to zap it into sparkles and points. If a rock reaches the station, its shield gets a crack, and three cracks end the round. Waves get a little busier each time, and big rocks split into two small ones.","lookAndFeel":"A friendly donut-shaped station with blinking lights and a see-through bubble shield. Rocks are lumpy brown and grey shapes that turn slowly. Each zap makes a fizzy pop sound and a burst of colored sparkles, and a new wave starts with a short trumpet beep.","makeItYours":["What are you protecting: a space station, a moon base, or a sleeping space whale?","What are the rocks: space rocks, slime blobs, or floating junk?","What does zapping look like: sparkles, bubbles, or the rocks turning into flowers?","How fast should rocks come: slow and calm, medium, or super fast?","What happens when a wave is cleared: fireworks, the station does a spin, or a dance?"],"levelUp":["Add a power button that fills up and zaps every rock on screen at once.","Add a boss rock that needs five taps.","Add an endless mode with a best wave reached that is remembered."],"buildNotes":"Canvas loop, rocks with position and velocity aimed at the center, tap hit testing by distance, split rocks spawned on hit, particle bursts, Web Audio noise pop, best wave in localStorage."},{"id":"space-lost-little-astronaut","title":"Lost Little Astronaut","pitch":"Help a little astronaut find the way home by choosing where to go next.","kind":"story","ages":["kid"],"themes":["space"],"size":"small","howItWorks":"Each screen is one picture scene with a short line of story and two or three big picture buttons to choose from, like the red planet or the ice moon. Your choices lead to different places and friendly helpers, and every path ends happily back home, but in a different way. A map at the end shows the path you took and which endings you have found.","lookAndFeel":"Simple drawn scenes in SVG: a purple planet with bouncy plants, an ice moon with a sleepy space penguin, a ringed planet you can slide down. Short words in big letters with picture buttons for kids who are still learning to read. Soft background music made of a few gentle notes, and a twinkle sound on each choice.","makeItYours":["Who is the lost astronaut: a kid, a puppy, or a tiny robot?","Who helps on the way: a talking comet, a moon rabbit, or a kind alien?","What is the astronaut looking for besides home: a lost teddy, a missing star, or a shiny space marble?","How many endings should there be: three, four, or five?","Should the story be read aloud with tones, or just pictures and words?"],"levelUp":["Add a small puzzle in one scene, like matching star shapes to open a door.","Add a collection of space stickers you earn for each ending found.","Add a second chapter that starts after you get home."],"buildNotes":"A story object with scenes, text, picture, and choices pointing to next scene ids, rendered by one function; SVG scenes drawn from simple shapes; endings found saved in localStorage; Web Audio gentle melody loop with a mute button."},{"id":"space-rocket-countdown-timer","title":"Rocket Countdown Timer","pitch":"Set a timer for a job, and when time is up your rocket blasts off.","kind":"tool","ages":["kid","teen"],"themes":["space","office"],"size":"small","howItWorks":"You pick a task picture (like tidy up, read, or brush teeth) and a time, then press start. A rocket on the launch pad slowly fills with fuel as the time goes by, and in the last ten seconds a big countdown appears. At zero the rocket blasts off into the sky with smoke and stars, and the finished task gets a sticker on today's launch board.","lookAndFeel":"A tall rocket in the middle with a fuel bar inside it that rises from the bottom, on a launch pad under a dusk sky. Big readable numbers, chunky start and pause buttons. The blast-off plays a rumbling whoosh made with Web Audio noise, then a happy fanfare.","makeItYours":["What tasks are on your list: homework, tidy up, practice, or your own?","What does the rocket look like: classic red and white, a shiny silver one, or a cartoon one with windows and faces?","Where does the rocket fly at the end: to the Moon, to Mars, or through a rainbow?","How long are the timers: short like 2 minutes, medium like 10, or set your own?","Should it give a five-minute warning sound?"],"levelUp":["Add a planet map that unlocks a new planet every few launches.","Add a break timer that starts after each launch.","Add a week view showing how many launches you did each day."],"teenTwist":"Turn it into a focus timer with work and break rounds, a custom task list, and a simple week chart of focus minutes saved on the device.","buildNotes":"Timer based on Date.now differences so it stays accurate, SVG rocket with a clip-path fuel fill, CSS keyframes for launch, Web Audio noise burst plus fanfare, task list and launch log in localStorage."},{"id":"space-gravity-slingshot","title":"Gravity Slingshot","pitch":"Fling a space probe so the planets' pull curves it into the target.","kind":"game","ages":["teen"],"themes":["space"],"size":"medium","howItWorks":"Each level shows a launch point, a glowing target ring, and one or more planets in the way. You drag back from the probe to set direction and power, and a short dotted line hints at the first part of the path. Once launched, every planet pulls on the probe, curving its path, so you have to use their gravity to bend around obstacles and reach the ring. Fewer tries earns more stars.","lookAndFeel":"Minimal neon space style: planets as glowing circles with faint rings showing how far their pull reaches, the probe as a small bright dot leaving a fading trail. Dark background with a subtle grid. A soft whoosh on launch, a deep hum when passing close to a planet, and a bright chord on hitting the target.","makeItYours":["What do you launch: a probe, a paper plane, or a tiny cat in a bubble?","How long is the aim hint: no hint, a short hint, or the full path for practice mode?","What extra obstacles appear: asteroid belts, black holes, or moving moons?","How many levels: 10 hand-made ones, or random levels that never end?","What style: neon lines, chalkboard sketch, or bright cartoon?"],"levelUp":["Add a level editor where you place planets and the target and test them.","Add planets that repel instead of pull.","Add a replay that draws your best path for each level."],"teenTwist":"Use inverse-square gravity with adjustable planet mass, show speed and distance live, and add a par number of tries per level so players learn to plan slingshots instead of guessing.","buildNotes":"Canvas loop with fixed time step, acceleration summed from each planet as mass over distance squared, drag to aim with pointer events, levels as a JSON array, trail as a ring buffer, stars per level in localStorage."},{"id":"space-mars-base-builder","title":"Mars Base Builder","pitch":"Build a little base on Mars and keep power, water and food in balance.","kind":"game","ages":["teen"],"themes":["space","robots"],"size":"medium","howItWorks":"A small grid of red ground is your base site, and you start with a few supplies. You place modules like solar panels, water recyclers, greenhouses, and living domes, each costing supplies and making or using power, water, and food. Press next day to see the numbers update; dust storms sometimes cut solar power, so you need batteries and planning. Reach a goal like 10 happy crew for 30 days to win.","lookAndFeel":"Top-down tiles drawn with simple shapes: blue panel grids, green glass greenhouse domes, white living domes, on rusty orange ground with little rocks. A clean side panel with three resource bars and arrows showing up or down per day. A gentle beep for each day, a crackle and orange haze for dust storms.","makeItYours":["Who lives in the base: people, robots, or friendly space hamsters?","What is the goal: survive 30 days, grow to 20 crew, or build a rocket home?","What events happen: dust storms, supply drops, or a broken robot to fix?","How hard is it: relaxed, balanced, or tough with fewer supplies?","What planet or moon: Mars, the Moon, or an ice moon?"],"levelUp":["Add a research tree that unlocks better modules.","Add a chart of resources over the days.","Add save slots so you can keep several bases on the device."],"teenTwist":"Model production and use per module as a small economy, show daily net flow for each resource, and let players tune event chance to test how robust their base design is.","buildNotes":"Grid as a 2D array of module types, a module table with costs and per-day effects, a nextDay function that applies effects and random events, DOM or canvas tiles, game state saved as JSON in localStorage."},{"id":"space-solar-system-scale-trip","title":"Scale Trip to Neptune","pitch":"Scroll across a solar system drawn to true distance and see how far apart the planets really are.","kind":"learning","ages":["teen"],"themes":["space"],"size":"small","howItWorks":"The page is one very long sideways strip with the Sun at the start and each planet placed at its real relative distance. As you scroll, a counter shows how far you have gone in astronomical units and how long light takes to get there, about 8 minutes to Earth and about 4 hours to Neptune. Each planet has a small fact card, and long empty stretches show quiet notes about just how empty space is.","lookAndFeel":"Black background, a huge glowing Sun edge at the start, planets as small accurate-color circles. A slim fixed bar at the top with distance and light-time counters. Optional travel mode auto-scrolls at the speed of light scaled down, with a soft rising tone near each planet.","makeItYours":["What unit do you want shown: astronomical units, kilometers, or minutes of light travel?","Should planet sizes also be to scale, or bigger so you can see them?","What travels with you: a beam of light, a rocket, or a snail for laughs?","Add bonus stops: the asteroid belt, Pluto, or none?","What tone: calm and quiet, or fun with jokes in the empty parts?"],"levelUp":["Add a second mode comparing planet sizes side by side to scale.","Add a speed picker: walking, car, jet, rocket, light.","Add a short quiz at the end about what you saw."],"teenTwist":"Let the user switch speeds and compute travel time live from distance divided by speed, which turns the scroll into a hands-on feel for scale and units.","buildNotes":"One wide container with planets positioned by well-known average distances in AU (Mercury 0.39, Venus 0.72, Earth 1, Mars 1.52, Jupiter 5.2, Saturn 9.5, Uranus 19.2, Neptune 30.1), scroll listener updating counters, optional requestAnimationFrame auto-scroll, Web Audio tone near planets."},{"id":"sports-penalty-kick","title":"Penalty Kick Hero","pitch":"Pick a spot, kick the ball, and try to sneak it past the goalie.","kind":"game","ages":["kid"],"themes":["sports","arcade"],"size":"small","howItWorks":"A goal fills the screen with a cartoon goalie in the middle. Tap where you want to shoot (left, middle, right, high or low) and the ball flies there while the goalie dives to guess. Five kicks make a round; score as many goals as you can, then swap and be the goalie who picks a side to dive.","lookAndFeel":"A big friendly goal and a goalie drawn in SVG with stretchy arms, on bright green grass under a blue sky. The ball spins as it flies and the net wobbles on a goal. A crowd cheer made from noise bursts and a whistle beep at the start of each kick.","makeItYours":["Who is the goalie: a giant octopus, a robot, or a sleepy bear?","What do you kick: a ball, a pumpkin, or a star?","Where is the field: a park, the beach, or the moon?","How many kicks in a round: 3, 5, or 10?","What happens on a goal: confetti, fireworks, or the goalie does a funny flop?"],"levelUp":["A two player mode where one kicks and one guards on the same device.","A goalie that remembers where you kicked last time and guesses smarter.","Wind that pushes the ball a little to one side."],"buildNotes":"Tap zones map to target points; animate the ball along a curved path with requestAnimationFrame and pick the goalie's dive randomly. Whistle and cheer from Web Audio oscillators and filtered noise; best score in localStorage."},{"id":"sports-mini-golf","title":"Silly Mini Golf","pitch":"Pull back and let go to roll the ball past silly obstacles into the hole.","kind":"game","ages":["kid"],"themes":["sports","nature"],"size":"medium","howItWorks":"Seen from above, each hole has a start spot, a flag and fun obstacles like a windmill, bumpers and a pond. Drag back from the ball to aim and choose power, then let go and watch it roll and bounce off walls. Count your hits on each of three holes, and try to finish the course in as few hits as you can.","lookAndFeel":"Bright green putting areas with chunky wooden walls drawn on canvas, a spinning windmill and cartoon flowers around the edges. A dotted aim line shows direction and a power bar fills as you pull. A soft clack sound on each bounce and a happy plop when the ball drops in.","makeItYours":["What are the obstacles: a windmill, a sleepy turtle, or a bouncy jelly?","Where is the course: a garden, a candy land, or a castle?","How many holes: 3, 5, or 9?","What color is your ball: red, glittery gold, or rainbow?","What happens if the ball falls in water: it bounces back, a duck brings it back, or you start again?"],"levelUp":["Moving obstacles that you have to time your shot around.","Turns for two or more players on the same device.","A score card that remembers your best total for each course."],"buildNotes":"Canvas with simple 2D ball physics (velocity, friction, wall reflection) and drag-to-aim input for touch and mouse. Holes defined as arrays of wall rectangles; best totals in localStorage."},{"id":"sports-trophy-maker","title":"Trophy Maker","pitch":"Design your very own shiny trophy and put it on your trophy shelf.","kind":"creative","ages":["kid"],"themes":["sports"],"size":"small","howItWorks":"Build a trophy piece by piece: pick a base, a cup or shape on top, handles, a color and a topper like a star or ball. Write a short name on the label, like Best Kicker or Super Helper. Tap save and it lands on your trophy shelf with a shine, and you can tap any trophy on the shelf to see it big again.","lookAndFeel":"Big SVG trophy parts that snap together in the middle of the screen, with a shiny metal gradient and a sparkle that slides across. A wooden shelf at the bottom holds saved trophies in a row. A tiny fanfare plays when a trophy is saved.","makeItYours":["What color metals can you pick: gold, silver, or rainbow?","What toppers can go on top: a ball, a star, or an animal?","Who are the trophies for: you, your family, or your pet?","Where do trophies live: a shelf, a glass case, or a treasure room?","What sound plays when you save: a fanfare, a cheer, or a drum roll?"],"levelUp":["Medals and ribbons you can design too.","A ceremony button where the trophy spins on a stage with a drum roll.","Stickers and patterns you can paint on the cup."],"buildNotes":"Trophy as layered SVG groups chosen from small option arrays, with fill colors from a gradient set. Saved trophies stored as option objects in localStorage and redrawn on the shelf."},{"id":"sports-animal-sports-day","title":"Animal Sports Day","pitch":"Help a little animal try three fun events at the big sports day.","kind":"story","ages":["kid"],"themes":["sports","nature"],"size":"medium","howItWorks":"You pick an animal friend and follow them through a short sports day story told in simple picture scenes. At each event there is a tiny challenge: tap fast to run a race, tap at the right moment to jump over a puddle, and swing in time to throw a beanbag. Whatever happens, the story ends with a ceremony where your animal gets a ribbon for what they did best, plus a friendly cheer for trying.","lookAndFeel":"Soft round animals drawn in SVG on a sunny field with flags, a finish line and other animal friends cheering from the side. Very short text in big letters with pictures, so early readers can follow. Whistle beeps, happy claps and a short victory tune.","makeItYours":["Which animal do you help: a bunny, a turtle, or a hedgehog?","What events are at sports day: a race, a long jump, or a sack hop?","Who is the friend that cheers you on: a big bear, a bird, or a frog?","What do you win: a ribbon, a medal, or a big cake?","Is the field in a forest, on a farm, or in the snow?"],"levelUp":["A choice of which event to do first.","A relay race where you switch between two animals.","A ribbon collection that remembers every sports day you finished."],"buildNotes":"Story as an array of scenes, each with text, a picture layout and an optional mini-challenge function (tap counter, timing bar, swing meter). Sounds from Web Audio; ribbons saved in localStorage."},{"id":"sports-hoop-math","title":"Hoop Math","pitch":"Make baskets worth 1, 2, or 3 points and add up your score.","kind":"learning","ages":["kid"],"themes":["sports"],"size":"small","howItWorks":"A player stands on a court with three spots marked 1, 2 and 3. Pick a spot to shoot from; the ball sails into the hoop and the points drop into a scoreboard sum. After a few shots the game asks what the total is now, and you pick from three answers; right answers fill up a trophy meter.","lookAndFeel":"A simple side view of a court drawn in SVG with a bouncy orange ball and a hoop whose net swishes. Big dot numbers next to the digits so the youngest players can count dots. A swish sound on every basket and a buzzer-style beep at the end.","makeItYours":["What sport is it: basketball, throwing balls in a bucket, or kicking into goals?","What numbers are on the spots: 1, 2, 3, or bigger like 5 and 10?","Who is the player: a kid, a kangaroo, or a robot?","Do you add up, take away, or both?","What fills up when you are right: a trophy, a star jar, or a crowd that gets louder?"],"levelUp":["A two team mode where you work out who is ahead and by how much.","Missed shots so you learn that some shots add zero.","A times mode: three shots from the 2 spot make how many?"],"buildNotes":"SVG ball path animated with CSS or requestAnimationFrame; generate answer choices near the real total. Swish from filtered noise; progress in localStorage."},{"id":"sports-team-scoreboard","title":"Big Team Scoreboard","pitch":"Keep score for any game in the yard with a big, loud scoreboard.","kind":"tool","ages":["kid","teen"],"themes":["sports","office"],"size":"small","howItWorks":"Type two team names and pick colors, then use big plus and minus buttons to add 1, 2 or 3 points. A game clock counts down with a buzzer at zero, and you can track periods or halves. When the game ends, it saves the final score to a game history list so you can see who won last time.","lookAndFeel":"A stadium-style scoreboard with glowing digital numbers drawn in CSS, each team in its own color. Buttons are extra large for tapping from a distance. A loud buzzer made with a square wave and a short cheer when a team scores.","makeItYours":["What game is it for: soccer, basketball, or a made-up backyard game?","How do teams score: 1 point at a time, or 1, 2 and 3?","How long is a game: 5 minutes, 10 minutes, or no clock?","What does the scoreboard look like: stadium lights, a chalkboard, or a space screen?","What sound plays at the end: a buzzer, a horn, or a drum roll?"],"levelUp":["Fouls or timeouts for each team.","A best of three or best of five series tracker.","A history page with total wins for each team name."],"teenTwist":"Add a stats mode that logs each score with the time it happened and shows a score-over-time chart and scoring runs after the game.","buildNotes":"Simple state object rendered to large text; countdown with Date.now to avoid drift; buzzer from a square-wave oscillator; game history array in localStorage."},{"id":"sports-hoop-shot","title":"Flick Hoop Shot","pitch":"Flick the ball up into the hoop and score as many as you can in a minute.","kind":"game","ages":["kid","teen"],"themes":["sports","arcade"],"size":"small","howItWorks":"A ball sits at the bottom of the screen and a hoop hangs above. Swipe or drag-and-release to flick the ball in an arc; it bounces off the rim and backboard with real-feeling physics. You have 60 seconds; after 10 baskets the hoop starts sliding side to side, and later a gentle wind arrow pushes your shots.","lookAndFeel":"A bold orange ball with seam lines and a red hoop with a swinging net, drawn on canvas against an evening sky gym. Swish shots without touching the rim give a flame trail and bonus points. Bounce thuds and a swish sound made with filtered noise.","makeItYours":["What do you throw: a basketball, a paper ball into a bin, or a cookie into a jar?","How long is a round: 30, 60, or 90 seconds?","What makes it harder: a moving hoop, wind, or a smaller hoop?","Where are you playing: a gym, a rooftop, or a pirate ship?","What is the bonus for a perfect swish: double points, a flame ball, or extra time?"],"levelUp":["Two players taking turns with the higher score winning.","A trick shot mode with bumpers the ball can bank off.","Unlockable ball designs earned by your best score."],"teenTwist":"Show shot stats after each round (shooting percentage, swish rate, best streak) and add a hard mode with realistic angle and power windows.","buildNotes":"Canvas game loop with gravity, circle-vs-segment collisions for the rim and backboard, and swipe velocity from pointer events. Best score in localStorage."},{"id":"sports-skill-tracker","title":"Skill Streak Tracker","pitch":"Write down your practice and watch your skills and streaks grow.","kind":"tool","ages":["kid","teen"],"themes":["sports","office"],"size":"small","howItWorks":"Add the skills you are practicing, like ball juggles, jump rope skips or free throws. After practice, log minutes or how many you did, and the app saves it with the date. Each skill has a goal and a progress bar, best records light up with a badge, and a calendar shows your practice streak.","lookAndFeel":"A sporty dashboard with a card for each skill, each in its own color with a simple icon drawn in SVG. Progress bars fill with a little bounce and new personal bests get a gold glow. Big friendly number buttons make logging quick on a tablet.","makeItYours":["Which skills do you track: juggling, jump rope, or shooting?","Do you count minutes, how many times, or both?","What do you earn: badges, belts with colors, or levels?","What is your weekly goal: 3 days, 5 days, or every day?","Who cheers you on in the app: a coach whistle, a mascot, or a trophy that grows?"],"levelUp":["A chart for each skill that shows your numbers going up over time.","Challenge cards like beat yesterday's number.","A warm up timer before each practice."],"teenTwist":"Add a training plan with weekly targets per skill, averages and personal-best history charts, and notes on what to work on next session.","buildNotes":"Skills and log entries stored as arrays in localStorage; streak computed from logged dates; simple SVG line charts drawn from the entries."},{"id":"sports-air-hockey","title":"Table Air Hockey","pitch":"Two players hit a puck back and forth and try to slide it into the goal.","kind":"game","ages":["kid","teen"],"themes":["sports","arcade"],"size":"small","howItWorks":"A table fills the screen with a goal at each end and a paddle for each player. Each player drags their own paddle on their half (or uses keys) to hit the puck, which slides and bounces off the walls. First to 7 goals wins, and there is a single player mode against a computer paddle with easy, medium and hard.","lookAndFeel":"A glossy table with glowing edges drawn on canvas, round paddles in two team colors, and a puck that leaves a short fading trail. Goals flash the scorer's color and play a quick horn. Click sounds when the puck hits paddles and walls.","makeItYours":["What is the table like: classic arcade, an ice pond, or a space station?","What is the puck: a puck, a cookie, or a little UFO?","How many goals to win: 3, 7, or 11?","How smart is the computer player: sleepy, clever, or a champion?","What team colors and names do the two players have?"],"levelUp":["Power ups that make your goal smaller or the puck faster.","Two pucks at once for chaos mode.","A best of three match with a winner's trophy screen."],"teenTwist":"Tune a smarter computer opponent that predicts bounces, and add match stats like shots, saves and fastest puck speed.","buildNotes":"Canvas loop with circle collision and velocity transfer from paddle movement; multi-touch pointer events let two players drag at once on a tablet. Sounds from short oscillator blips."},{"id":"sports-tournament-bracket","title":"Tournament Bracket Builder","pitch":"Make a bracket for your own tournament and tap winners until one champion is left.","kind":"tool","ages":["teen"],"themes":["sports","office"],"size":"medium","howItWorks":"Enter 4 to 16 players or teams, shuffle or seed them, and the app draws a knockout bracket. Tap the winner of each match (optionally typing the score) and they move to the next round, all the way to a champion screen. A round robin option instead builds a table of everyone-plays-everyone with wins, losses and points, and every tournament is saved to reopen later.","lookAndFeel":"A clean bracket of connected boxes drawn in SVG that scales to the screen, with winners highlighted and losing lines faded. The final opens a spotlight trophy view with confetti. Simple sporty palette that the user can switch.","makeItYours":["What is the tournament for: a video game night, table tennis, or a family board game?","Knockout only, round robin, or groups then knockout?","How are byes and seeds handled: random, ranked, or picked by hand?","What does the champion screen look like: trophy, podium, or a crown?","What color style: dark esports look, sunny park, or classic paper bracket?"],"levelUp":["Double elimination with a losers bracket.","A third place match and a final standings table.","Head to head records for names that play in many tournaments."],"teenTwist":"Handle any player count with automatic byes, tiebreakers for round robin (head to head, point difference), and a printable view.","buildNotes":"Bracket generated as rounds of match objects with byes for non-powers-of-two; render with SVG paths between boxes. Tournaments saved as JSON in localStorage."},{"id":"sports-coach-playbook","title":"Coach Playbook","pitch":"Draw plays on a field, move players step by step, and watch the play run.","kind":"creative","ages":["teen"],"themes":["sports","office"],"size":"small","howItWorks":"Pick a field or court, drag player tokens and a ball onto it, and draw arrows for runs and passes. Each play has a few steps; move the tokens in each step, then press play to watch them glide smoothly from step to step. Name and save plays in a playbook to show friends on the same device.","lookAndFeel":"A whiteboard-style top-down field drawn in SVG with clean lines, two token colors with numbers, and dashed pass arrows. A timeline of step dots runs along the bottom. Smooth tweening animation when the play runs, with a whistle beep at the start.","makeItYours":["Which field: soccer, basketball, or a made-up sport?","How many players per team: 3, 5, or 11?","What style: whiteboard and marker, chalkboard, or neon tactics screen?","What can you draw: run arrows, pass arrows, or zones?","How do you sort plays: attack and defense, by name, or by color tags?"],"levelUp":["A defense team that you can also move.","Speed control and a loop button for watching a play again.","A quiz mode that pauses a play and asks where the pass should go."],"teenTwist":"Add formation presets, freehand notes on each step, and a step-by-step teaching mode for explaining a play to a team.","buildNotes":"SVG field with draggable tokens via pointer events; each step stores token positions and the player interpolates between steps with requestAnimationFrame. Playbook saved in localStorage."},{"id":"sports-pocket-season","title":"Pocket Coach Season","pitch":"Coach your own made-up team through a whole season and try to lift the cup.","kind":"game","ages":["teen"],"themes":["sports"],"size":"medium","howItWorks":"You coach an invented team in a league of eight invented teams over a short season. Before each match you choose a training focus (attack, defense, fitness, teamwork) and a game plan, which shift your team's ratings and how the match plays. The match is shown as a quick animated summary with key moments and a final score, the league table updates, and at the end of the season the top team lifts the cup.","lookAndFeel":"A clean manager dashboard with team crests you design from simple shapes and colors, a league table and a match screen with a top-down field and moving dots. Ratings show as bars that rise and fall. A crowd roar and whistle for goals, made with filtered noise.","makeItYours":["What is your team called and what does its crest look like?","Which sport is it: soccer, basketball, or a made-up sport?","How long is the season: 7 matches, 14 matches, or a cup knockout?","What choices do you make each week: training, lineup, or tactics?","What is the prize: a cup, a golden ball, or a parade?"],"levelUp":["Players with names, skills and form that changes over the season.","Rival coaches with different styles.","A multi-season mode where young players improve each year."],"teenTwist":"Show the math: ratings feed into a match model with visible probabilities, season stats and charts, so the player learns how strategy changes the odds without any betting.","buildNotes":"Season as a round-robin fixture list; matches simulated with a seeded random model weighted by ratings and the chosen plan; league table sorted by points then goal difference. Save the season in localStorage."},{"id":"unicorns-rainbow-sky-run","title":"Rainbow Sky Run","pitch":"Tap to make your unicorn jump over clouds and grab shiny stars!","kind":"game","ages":["kid"],"themes":["unicorns","arcade"],"size":"small","howItWorks":"A unicorn gallops by itself along a rainbow road that scrolls to the left. Tap the screen or press space to jump over puffy grey clouds and catch stars floating in the air. Bumping a cloud ends the run, and the screen shows how many stars you got and your best ever.","lookAndFeel":"A round, friendly unicorn drawn on canvas with a bouncing mane, running over a striped rainbow road under a pastel sky with slow drifting clouds. Stars twinkle and burst into tiny sparkles when caught, with a soft chime; a jump makes a happy boing sound.","makeItYours":["Who runs on the road: a unicorn, a pony with wings, or a sparkly cat?","What do you collect: stars, cupcakes, or little hearts?","What do you jump over: grey clouds, puddles, or sleepy snails?","Should it get faster slowly or stay calm and easy?","What color is the road: a full rainbow, all pink, or ocean blue?"],"levelUp":["A double jump that leaves a sparkle trail","A night mode with glowing stars and a moon","A star shop where saved stars unlock new manes for the runner"],"buildNotes":"Canvas game loop with requestAnimationFrame, simple gravity for the jump, and box collision checks. Store best score in localStorage and make jump and collect sounds with Web Audio oscillators."},{"id":"unicorns-star-catcher","title":"Falling Star Catcher","pitch":"Slide your unicorn left and right to catch falling stars in a basket.","kind":"game","ages":["kid"],"themes":["unicorns","space","arcade"],"size":"small","howItWorks":"Stars, moons and little rainbows fall slowly from the night sky. Drag your unicorn along the bottom (or use the arrow keys) to catch them in a basket, but dodge the rain drops that make it soggy. Each round lasts 60 seconds and ends with a big count of everything you caught.","lookAndFeel":"A dark blue sky with soft purple hills, a unicorn holding a woven basket drawn in SVG or canvas. Caught stars pop with a bright ding and pile up in the basket; rain drops make a gentle plop and a tiny cloud puff.","makeItYours":["Who catches the stars: a unicorn, a bunny, or a friendly robot?","What falls from the sky: stars, gumdrops, or snowflakes?","What should you dodge: rain drops, grumpy clouds, or pinecones?","How long is one round: 30 seconds, one minute, or until you miss three?","What does the catcher hold: a basket, a bucket, or a big hat?"],"levelUp":["A golden star that makes everything fall in slow motion for a few seconds","Two players on one keyboard, each with their own unicorn and color","A sky book that remembers every kind of thing you have ever caught"],"buildNotes":"Canvas loop with an array of falling objects at random x positions and speeds; pointer events plus arrow keys move the catcher. Web Audio for ding and plop sounds, localStorage for best score."},{"id":"unicorns-sparkle-painter","title":"Sparkle Trail Painter","pitch":"Draw with your finger and leave a trail of rainbow sparkles!","kind":"creative","ages":["kid"],"themes":["unicorns"],"size":"small","howItWorks":"A big drawing page fills the screen. Drag your finger or mouse to paint lines that shift through rainbow colors and leave twinkling sparkles behind. Tap big picture buttons to switch brushes, stamp stars or hearts, or shake everything clean, and save up to six pictures in a little gallery.","lookAndFeel":"A white or deep night page with a row of large round buttons at the bottom, each showing an icon instead of words. Lines glow softly, sparkles fade out over a second, and each brush plays a soft tinkle while drawing.","makeItYours":["What color is the page: white like paper, dark like night, or soft pink?","What stamps can you add: stars, hearts, or tiny unicorn heads?","What does the magic brush do: change colors, make bubbles, or draw mirror lines?","What sound plays while you draw: tinkly bells, soft whooshes, or no sound?","How do you clear the page: a shake button, a broom, or a rain of glitter?"],"levelUp":["A mirror mode that copies your drawing on both sides like a butterfly","A slow replay button that redraws your picture stroke by stroke","Glow-in-the-dark mode where the lines light up on a black page"],"buildNotes":"Full-screen canvas with pointer events, HSL hue that advances with each segment, and a small particle array for sparkles. Save pictures as dataURL thumbnails in localStorage (cap the count to stay small)."},{"id":"unicorns-color-lab","title":"Rainbow Color Lab","pitch":"Mix two paint colors and see what new color you make!","kind":"learning","ages":["kid"],"themes":["unicorns"],"size":"small","howItWorks":"Three paint pots (red, yellow, blue) sit on a table next to an empty rainbow. Drag two colors into the mixing bowl to see the new color appear, and drop it into the matching stripe of the rainbow. When all seven stripes are filled, the rainbow lights up and a unicorn runs across it.","lookAndFeel":"Chunky paint pots and a wooden bowl drawn in SVG, with a soft swirl animation when colors mix. The rainbow starts as grey outlines and each filled stripe glows; a little fanfare plays when the rainbow is done.","makeItYours":["Who comes to see the rainbow at the end: a unicorn, a bird, or a dragon?","Which colors do you start with: red, yellow and blue, or add white too?","What do you mix in: a bowl, a cauldron, or a cloud?","Should there be words for the colors or only pictures?","What happens if you mix a strange color: a funny sound, a silly face, or bubbles?"],"levelUp":["A light-and-dark mode where adding white or black makes pastel and deep shades","A challenge mode that shows a mystery color and asks you to make it","A color book that keeps every color you have ever mixed"],"buildNotes":"SVG drag and drop with pointer events; mix colors with a simple lookup table for the primary pairs plus RGB averaging for free mixing. Web Audio for a swirl sound and a short win melody."},{"id":"unicorns-unicorn-maker","title":"Make a Unicorn","pitch":"Build your very own unicorn and give it a name!","kind":"creative","ages":["kid"],"themes":["unicorns"],"size":"small","howItWorks":"A plain unicorn stands in the middle of a meadow. Tap big buttons to change the body color, mane, horn, wings, spots and a little accessory, and watch it change right away. Give it a nickname, then save it to your stable, where all your unicorns stand together and can be tapped to make them prance.","lookAndFeel":"The unicorn is drawn in layered SVG so every part can swap color and shape. A soft meadow with flowers is the background; each change makes a pop of sparkles and a tiny chime, and the stable shows the saved unicorns side by side.","makeItYours":["What parts can you change: mane and horn, wings and tail, or everything?","What fun extras can it wear: a bow, a cape, or rain boots?","Where does your unicorn live: a meadow, a cloud castle, or under the sea?","What does it do when you tap it: prance, sneeze glitter, or giggle?","How many unicorns can live in the stable: three, ten, or as many as you like?"],"levelUp":["A random button that surprises you with a wild unicorn","Little animations for each unicorn, like flying or rolling in flowers","A family picture mode where all your unicorns line up together"],"buildNotes":"Layered inline SVG with parts toggled or recolored via attributes; options held in a small state object. Save the stable as JSON in localStorage and use Web Audio for the pop and chime."},{"id":"unicorns-stable-care","title":"Unicorn Stable Care","pitch":"Take care of a baby unicorn: feed it, brush it, and play with it!","kind":"game","ages":["kid","teen"],"themes":["unicorns","nature"],"size":"medium","howItWorks":"A baby unicorn lives in a cozy stable with three little meters: hungry, sleepy and playful. Drag an apple to feed it, use the brush to make it sparkle, play a quick ball game, or turn off the lamp so it naps. Happy care earns hearts, and after enough hearts the baby grows into a bigger unicorn with a new look.","lookAndFeel":"A cozy wooden stable with straw on the floor and a window that shows day or night. The unicorn is a soft SVG character with blinking eyes and happy, sleepy or bored faces; brushing makes sparkles and a soft swish, eating makes a crunch.","makeItYours":["What is your pet: a baby unicorn, a tiny dragon, or a fluffy cloud pony?","What does it love to eat: apples, carrots, or star cookies?","What game do you play together: catch the ball, hide and seek, or bubble popping?","What nickname does your pet have?","What does it grow into at the end: a big unicorn, one with wings, or one with a rainbow mane?"],"levelUp":["A day and night clock where the unicorn sleeps when the sky is dark","Little outfits and stable decorations bought with hearts","A photo album that keeps a picture from each stage of growing up"],"teenTwist":"Add a needs system with meters that slowly drop over real time, a care log with stats, and a balance challenge where keeping all meters high together unlocks rare growth paths.","buildNotes":"Inline SVG pet with swappable expressions, drag and drop for items, meters stored with timestamps in localStorage so they change between visits. Web Audio for crunch, swish and happy chirps."},{"id":"unicorns-rainbow-echo","title":"Rainbow Echo","pitch":"Watch the rainbow light up, then tap the colors in the same order!","kind":"game","ages":["kid","teen"],"themes":["unicorns","music"],"size":"small","howItWorks":"A big rainbow is split into color bands, and each band plays its own note. The rainbow lights up a short pattern, then you tap the bands in the same order. Each correct round adds one more step, and the game ends when you make a mistake, showing your longest pattern.","lookAndFeel":"Fat glowing rainbow arcs drawn in SVG, with a little unicorn on a cloud who nods when you get it right. Each band flashes bright and plays a soft bell note; a mistake makes a silly wobble sound instead of a harsh buzz.","makeItYours":["How many colors are in the rainbow: four for easy, six, or all seven?","What sounds do the colors make: bells, animal sounds, or piano notes?","Who cheers you on: a unicorn, an owl, or a happy sun?","How fast does the pattern play: slow and calm, or quicker each round?","What happens when you beat your best: confetti, fireworks, or a unicorn dance?"],"levelUp":["A two-player mode where players take turns adding one color to the pattern","A reverse mode where you tap the pattern backward","A song mode where long patterns play a real little tune"],"teenTwist":"Add a hard mode with speed-ups, a reverse round every fifth level, and a stats page showing best streak, average length and accuracy per color.","buildNotes":"SVG arcs as buttons with pointer events, a sequence array and a timed playback with setTimeout. Web Audio oscillators with short envelopes for notes; localStorage for best streak."},{"id":"unicorns-cloud-quest","title":"The Lost Rainbow","pitch":"Help a unicorn find the lost colors of the rainbow by choosing where to go.","kind":"story","ages":["kid","teen"],"themes":["unicorns","nature"],"size":"medium","howItWorks":"The rainbow over Cloud Valley has lost its colors, and a unicorn sets off to find them. Each page shows a picture scene and two or three big choice buttons, like 'cross the river' or 'ask the owl'. Each place hides one color found by a tiny task (tap the hidden gem, help a friend), and when all colors are back the rainbow returns.","lookAndFeel":"Each scene is a simple SVG or CSS landscape (river, forest, cloud tower) with the unicorn standing in front. Short sentences sit in a big rounded box, choices are large picture buttons, and a rainbow tracker at the top fills in as colors are found, with a twinkle sound.","makeItYours":["Who is the hero: a unicorn, a young knight on a pony, or a curious fox?","What got lost: the rainbow's colors, the stars, or the music of the valley?","Which places do you visit: a river, a candy forest, or a cloud tower?","Who helps along the way: a wise owl, a grumpy but kind troll, or a talking flower?","How should the story be told: very few words with pictures, or longer sentences?"],"levelUp":["A read-aloud button that speaks each page using the device's built-in voice","Secret paths that only appear if you found a special item earlier","A map page that shows where you have been"],"teenTwist":"Turn it into a branching story with an inventory and flags, so earlier choices change later scenes, and add a story map that shows every path you have unlocked.","buildNotes":"Scenes stored as a JS object graph (text, picture, choices, next scene); render one scene at a time with simple SVG backgrounds. Save progress and found colors in localStorage; optional speechSynthesis for read-aloud."},{"id":"unicorns-sparkle-synth","title":"Sparkle Synth","pitch":"Tap glowing stars to make your own twinkly music loop.","kind":"creative","ages":["kid","teen"],"themes":["unicorns","music"],"size":"small","howItWorks":"A grid of dim stars sits on a night sky: each row is a different note and each column is a beat. Tap stars to light them up, press play, and a shooting star sweeps across playing every lit star as a twinkly sound. Change the speed, clear the sky, or save your favorite loops.","lookAndFeel":"A dark purple sky with a glowing grid of star buttons in rainbow colors from low notes to high. The sweeping shooting star leaves a sparkle trail, and each lit star pulses when it plays; a unicorn on the side bobs its head to the beat.","makeItYours":["What makes the sound: stars in the sky, flowers in a garden, or bubbles in the sea?","How big is the grid: small and simple, or big for long songs?","What kind of sound: soft bells, bouncy plucks, or spacey whooshes?","Who dances to your music: a unicorn, a cat, or a robot?","Should there be a drum row too: yes with claps, yes with boops, or no drums?"],"levelUp":["Several instruments, each with its own color layer on the grid","A song chain that plays your saved loops one after another","A surprise button that makes a random pretty pattern"],"teenTwist":"Add scale choices (major, minor, pentatonic), per-row volume and waveform controls, swing timing, and a pattern bank with chaining to build full songs.","buildNotes":"CSS grid of buttons, a Web Audio scheduler using AudioContext.currentTime for steady timing, oscillators with short gain envelopes. Save patterns as arrays in localStorage."},{"id":"unicorns-prism-puzzle","title":"Prism Light Puzzle","pitch":"Turn magic crystals to bounce a light beam into every sleeping gem.","kind":"game","ages":["teen"],"themes":["unicorns","space"],"size":"medium","howItWorks":"A unicorn's horn shines a beam of light across a grid. Tap mirrors to rotate them and place prisms that split the beam into colors, so the right color reaches each gem. A level is solved when every gem glows, and the game counts your moves so you can try to solve it with fewer.","lookAndFeel":"A dark crystal cave grid drawn on canvas with clean glowing lines for beams. Mirrors and prisms are simple geometric shapes; gems go from dull grey to bright color with a rising chime when the right beam hits them.","makeItYours":["Where does the light come from: a unicorn's horn, a lighthouse, or a star?","What are the targets: gems, sleeping fireflies, or crystal flowers?","Do beams need the right color, or does any light work for easier levels?","How many levels to start: five, ten, or a level maker so you design your own?","What extra pieces exist: blockers, color filters, or beam splitters?"],"levelUp":["A level editor that saves your own puzzles","Moving mirrors that rotate on a timer","Star ratings for solving in the fewest moves"],"teenTwist":"Design a set of levels that teach one new rule at a time (reflection, splitting, color filtering, mixing) and track a par move count for each, like a real puzzle designer.","buildNotes":"Grid-based ray tracing: step the beam cell by cell, change direction on mirrors, branch on prisms with a loop guard. Levels as arrays of strings; canvas drawing with glow via shadowBlur; progress in localStorage."},{"id":"unicorns-rainbow-streaks","title":"Rainbow Streak Tracker","pitch":"Track the good habits you want to build, and grow a rainbow each week you keep them.","kind":"tool","ages":["teen"],"themes":["unicorns","office"],"size":"small","howItWorks":"You add up to seven habits you want to practice, like reading, practicing an instrument, sketching or tidying your room. Each habit is a color stripe, and every day you check it off, that stripe of your weekly rainbow grows a little. A calendar view shows streaks, and full weeks unlock a sparkle on that week's rainbow.","lookAndFeel":"Clean and calm: a big arching rainbow at the top with stripes that fill as you check things off, and a tidy list of habits below with rounded checkboxes. A small unicorn sits on the rainbow and does a quiet happy hop when a stripe is completed, with a soft chime.","makeItYours":["What habits do you want to track: reading, practicing music, or drawing every day?","How long is a streak goal: one week, a month, or your own number?","Who sits on the rainbow: a unicorn, a cat, or a little star?","What happens when you miss a day: nothing, a gentle reminder, or a free 'rest day' pass?","What look do you want: bright rainbow, soft pastels, or a dark mode?"],"levelUp":["A stats page with longest streak and best day of the week","Rest-day passes you can plan ahead so streaks stay fair","Export and import of your data as a text code for backup on the same device"],"teenTwist":"Add stats and a monthly heatmap per habit, flexible goals like three times a week, and notes for each day to reflect on what helped.","buildNotes":"Habits and daily check-ins stored as JSON keyed by date in localStorage; rainbow drawn as SVG arcs whose stroke length reflects progress. Calendar built with a CSS grid and the Date object."},{"id":"unicorns-sparkle-shop","title":"Sparkle Potion Shop","pitch":"Run a magic potion stand: buy ingredients, set your prices, and grow your shop.","kind":"game","ages":["teen"],"themes":["unicorns","office"],"size":"medium","howItWorks":"Each in-game day you check a made-up weather forecast, buy ingredients like moon dew and rainbow petals, choose a recipe and set a price. Then customers walk by and buy or skip depending on price, weather and how good your potion is, and the day ends with a report of sales and coins. Over 14 days you try to earn enough to upgrade your stand into a sparkling shop.","lookAndFeel":"A cheerful market street drawn in SVG with a small stand that gets fancier as you upgrade. Customers are simple round characters with thought bubbles showing a happy or unsure face; coin sounds jingle on each sale and a short tune plays at the end of each day.","makeItYours":["What do you sell: sparkle potions, rainbow smoothies, or star cookies?","Who are your customers: unicorns, forest animals, or friendly robots?","What changes demand: weather, a festival day, or a rival stand?","How long is the game: 7 days, 14 days, or endless?","What can you upgrade: a bigger cauldron, a sign, or a helper?"],"levelUp":["Recipe experiments that unlock new potions with different ingredients","Charts of daily earnings and customers","Events like a sparkle festival with special customers"],"teenTwist":"Model a small economy: price elasticity, ingredient spoilage, upgrade payback time, and a chart of profit per day so you can test strategies.","buildNotes":"Turn-based simulation with a simple demand formula (price, weather, quality) and seeded randomness; SVG scene with CSS animations for walking customers. Save the game in localStorage; Web Audio for coin jingles."}];
const THEMES = {unicorns:'🦄 Unicorns',princesses:'👑 Princesses',robots:'🤖 Robots',cars:'🏎️ Cars',space:'🚀 Space',arcade:'👾 Arcade',music:'🎧 Music',sports:'⚽ Sports',nature:'🌿 Nature',office:'💼 Office'};
const KINDS = {game:'🎮 Game',creative:'🎨 Creative',tool:'🧰 Tool',learning:'📚 Learning',story:'📖 Story'};
const AGES = {kid:'Kid (6–12)',teen:'Teen (13–17)'};
const state = {age:null, theme:null, kind:null, q:''};
try { Object.assign(state, JSON.parse(localStorage.getItem('idea-filters') || '{}')); } catch {}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(el, map, key) {
  el.innerHTML = '<button class="f" data-v="">All</button>' + Object.entries(map).map(([v, l]) => '<button class="f" data-v="' + v + '">' + l + '</button>').join(' ');
  el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { state[key] = b.dataset.v || null; render(); }));
}
chips(document.getElementById('ages'), AGES, 'age');
chips(document.getElementById('themes'), THEMES, 'theme');
chips(document.getElementById('kinds'), KINDS, 'kind');
const q = document.getElementById('q'); q.value = state.q || '';
q.addEventListener('input', () => { state.q = q.value; render(); });
document.getElementById('total').textContent = IDEAS.length;
function card(i) {
  const ages = i.ages.map((a) => '<span class="pill ' + a + '">' + (a === 'kid' ? 'Kid' : 'Teen') + '</span>').join('');
  const themes = i.themes.map((t) => '<span class="pill">' + (THEMES[t] || t) + '</span>').join('');
  const list = (xs) => '<ul>' + xs.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  return '<article class="card"><h2>' + esc(i.title) + '</h2><div class="pills">' + ages + '<span class="pill">' + (KINDS[i.kind] || i.kind) + '</span>' + themes + '<span class="pill">' + (i.size === 'medium' ? 'Medium' : 'Small') + '</span></div>'
    + '<p class="pitch">' + esc(i.pitch) + '</p>'
    + '<details><summary>Details</summary>'
    + '<h3>How it works</h3><p>' + esc(i.howItWorks) + '</p>'
    + '<h3>Look and feel</h3><p>' + esc(i.lookAndFeel) + '</p>'
    + '<h3>Make it yours</h3>' + list(i.makeItYours)
    + '<h3>Level up later</h3>' + list(i.levelUp)
    + (i.teenTwist ? '<h3>Teen twist</h3><p>' + esc(i.teenTwist) + '</p>' : '')
    + '<h3>For the builder</h3><p class="muted">' + esc(i.buildNotes) + '</p>'
    + '</details></article>';
}
function render() {
  try { localStorage.setItem('idea-filters', JSON.stringify(state)); } catch {}
  for (const [id, key] of [['ages','age'],['themes','theme'],['kinds','kind']]) document.querySelectorAll('#' + id + ' button').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.v || null) === state[key])));
  const words = (state.q || '').toLowerCase().split(/\s+/).filter(Boolean);
  const shown = IDEAS.filter((i) => (!state.age || i.ages.includes(state.age)) && (!state.theme || i.themes.includes(state.theme)) && (!state.kind || i.kind === state.kind)
    && words.every((w) => JSON.stringify(i).toLowerCase().includes(w)));
  document.getElementById('count').textContent = shown.length + ' shown';
  document.getElementById('grid').innerHTML = shown.length ? shown.map(card).join('') : '<p class="empty muted">No ideas match. Try fewer filters.</p>';
}
render();
</script>
</body>
</html>
