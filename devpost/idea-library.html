<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idea Library</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2430;--muted:#5d6475;--line:#e4ded3;--brand:#23855a;--soft:#dff3e9;--kid:#185c9e;--kid-soft:#e2eefa;--teen:#6d3fc0;--teen-soft:#efe8fb;--chip:#f0ece4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f232b;--ink:#eceef3;--muted:#a3a9b8;--line:#333945;--brand:#4cc08d;--soft:#1b3329;--kid:#6aaef0;--kid-soft:#1a2a3d;--teen:#b08cf0;--teen-soft:#2a2340;--chip:#272c35}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f232b;--ink:#eceef3;--muted:#a3a9b8;--line:#333945;--brand:#4cc08d;--soft:#1b3329;--kid:#6aaef0;--kid-soft:#1a2a3d;--teen:#b08cf0;--teen-soft:#2a2340;--chip:#272c35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;margin:0 0 4px}
.muted{color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.row b{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:4px;min-width:52px}
button.f{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
button.f[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;max-width:320px}
.count{font-weight:700;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h2{font-size:19px;margin:0}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.pill.kid{background:var(--kid-soft);color:var(--kid)} .pill.teen{background:var(--teen-soft);color:var(--teen)}
.pitch{font-weight:600}
details summary{cursor:pointer;color:var(--brand);font-weight:700}
details h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 4px}
details p,details ul{margin:0}
details ul{padding-left:20px}
.empty{padding:40px;text-align:center}
</style>
</head>
<body>
<main>
<h1>💡 Idea Library</h1>
<p class="muted">Ideas the guide can offer a kid who's stuck: <span id="total"></span> in all. Every one fits a single page with no internet, and each has questions that let the kid make it their own. Pick filters to browse; open an idea for the details.</p>
<div class="bar">
  <div class="row"><b>Age</b><span id="ages"></span></div>
  <div class="row"><b>Theme</b><span id="themes"></span></div>
  <div class="row"><b>Kind</b><span id="kinds"></span></div>
  <div class="row"><input type="search" id="q" placeholder="Search ideas…" aria-label="Search ideas"><span class="count" id="count"></span></div>
</div>
<div class="grid" id="grid"></div>
</main>
<script>
const IDEAS = [{"id":"arcade-glow-worm","title":"Glow Worm","pitch":"Steer a glowing worm to eat light dots and grow longer without bumping into yourself.","kind":"game","ages":["kid","teen"],"themes":["arcade","nature"],"size":"small","howItWorks":"A neon worm moves across a grid on its own, and you turn it with arrow keys or by swiping. Eating a glowing dot makes it one piece longer and adds a point. If it runs into its own tail the round ends, and your best length is saved. Walls wrap around in easy mode and stop you in hard mode.","lookAndFeel":"Dark grid with faint lines, the worm as rounded squares that fade from bright green to blue along its body, with two happy eyes. Dots pulse in pink and yellow. Each bite plays a short blip that goes a little higher as the worm grows.","makeItYours":["What is the hero: a glow worm, a neon train, or a light-up dragon?","What does it eat: light dots, pixel apples, or tiny stars?","Walls: wrap around to the other side, or stop you?","How fast: chill, normal, or turbo?","What colors glow: green and blue, pink and orange, or rainbow?"],"levelUp":["Add golden dots that give bonus points but vanish fast.","Add maze walls that change each level.","Add a two-player mode on one keyboard with two worms."],"teenTwist":"Add speed that ramps with length, portals that link two grid cells, and a stats screen with average length and longest run.","buildNotes":"Grid-based canvas loop on a fixed tick with setInterval or a time accumulator, worm as an array of cells, swipe detection from pointer start and end, best score in localStorage, Web Audio blip with pitch tied to length."},{"id":"arcade-neon-brick-bounce","title":"Neon Brick Bounce","pitch":"Bounce a glowing ball off your paddle to break all the bright bricks.","kind":"game","ages":["kid","teen"],"themes":["arcade"],"size":"small","howItWorks":"Rows of glowing bricks fill the top of the screen and a paddle sits at the bottom. You move the paddle with your finger, mouse, or keys to keep the ball bouncing up into the bricks. Each brick breaks with a flash and a point, and clearing all of them opens the next level. Miss the ball three times and the round is over.","lookAndFeel":"Neon outlines on black: cyan paddle, pink ball with a short glowing trail, bricks in a rainbow of rows. Broken bricks burst into little pixel squares. Each hit plays a note, and bricks higher up play higher notes so a level sounds like music.","makeItYours":["What is the ball: a glowing ball, a smiley face, or a bouncing donut?","What shape do the bricks make: a heart, a rocket, or your initials?","How many lives: three, five, or endless practice?","What breaks out of the bricks: pixel dust, stars, or confetti?","Paddle size: wide and easy, normal, or tiny and tricky?"],"levelUp":["Add power-ups that fall from bricks, like a wider paddle or a second ball.","Add tough bricks that need two or three hits.","Add a level picker with brick patterns you can draw yourself."],"teenTwist":"Make the bounce angle depend on where the ball hits the paddle, add a speed-up over time, and score with combos for breaking several bricks without touching the paddle.","buildNotes":"Canvas loop with ball velocity and wall and paddle reflection, brick grid as a 2D array with hit points, circle-rectangle collision, levels as string patterns, Web Audio notes per row, best score in localStorage."},{"id":"arcade-pixel-art-studio","title":"Pixel Art Studio","pitch":"Paint tiny square pixels to make your own game characters and pictures.","kind":"creative","ages":["kid","teen"],"themes":["arcade","robots"],"size":"small","howItWorks":"A big grid of empty squares sits in the middle with a palette of bright colors beside it. You tap or drag to color squares, use the eraser and fill bucket, and pick a grid size like 8 by 8 or 16 by 16. Finished pictures go into your gallery with a name, where you can open them again to keep working.","lookAndFeel":"A retro arcade frame around the canvas, with chunky pixel-style buttons and a dark background so colors pop. A tiny live preview at actual size shows how your art would look in a game. Each painted square makes a soft click, and saving plays a short coin-style jingle.","makeItYours":["What colors are in the palette: neon brights, soft pastels, or old-console colors?","How big is the grid: small 8 by 8, medium 16 by 16, or big 32 by 32?","What tools do you want: mirror drawing, fill bucket, or a shape stamper?","What does the gallery look like: an arcade cabinet wall, a museum, or a trophy shelf?","Should there be starter templates like a smiling blob, a heart, or a rocket?"],"levelUp":["Add a second frame and a play button so your drawing animates.","Add a mirror mode that paints both sides at once.","Add a big view that tiles your art like wallpaper."],"teenTwist":"Add multi-frame animation with adjustable speed, a custom palette editor, and onion skinning to see the previous frame while drawing.","buildNotes":"Canvas grid with pointer events for drag painting, flood fill with a queue, art stored as arrays of palette indexes in localStorage, preview canvas scaled with imageSmoothingEnabled false, Web Audio clicks."},{"id":"arcade-bonk-the-blobs","title":"Bonk the Blobs","pitch":"Tap the silly blobs as they pop out of their glowing holes.","kind":"game","ages":["kid"],"themes":["arcade"],"size":"small","howItWorks":"Nine glowing holes sit in a grid. Silly blobs pop up for a moment and you tap them for a point before they hide again. Sometimes a sleepy star pops up instead, and you should not tap it. A round lasts 30 seconds, and your best score is kept.","lookAndFeel":"Round neon holes in purple and cyan on a dark floor, blobs as squishy colored jelly shapes with big eyes. A bonked blob squishes flat with stars around its head, then giggles away. Each bonk plays a springy boing.","makeItYours":["What pops up: blobs, moles in sunglasses, or tiny robots?","What should you not tap: a sleepy star, a baby blob, or a flower?","How long is a round: 20, 30, or 60 seconds?","How many holes: 4 for easy, 9, or 16 for chaos?","What sound does a bonk make: boing, squeak, or a funny honk?"],"levelUp":["Add golden blobs worth more points.","Add a two-player mode where each player has their own side of the screen.","Add levels where blobs get faster and pop up in pairs."],"buildNotes":"DOM or SVG grid of holes with CSS transform animations for popping up, random timers per hole, pointerdown hit handling, round timer, best score in localStorage, Web Audio boing with a quick frequency drop."},{"id":"arcade-pixel-hop","title":"Pixel Hop","pitch":"Tap to make your pixel hero jump over things as the world rushes by.","kind":"game","ages":["kid"],"themes":["arcade","nature"],"size":"small","howItWorks":"Your pixel hero runs on its own along the ground while blocks and puddles come toward it. You tap the screen or press space to jump over them. Coins float above some gaps for extra points. The world speeds up slowly, and when you bump into something you see how far you ran and your best distance.","lookAndFeel":"Chunky pixel art drawn on canvas: a small square hero with a two-frame running animation, a scrolling ground line, and a neon city skyline moving slower behind it. A jump plays a rising bloop, a coin plays a bright ding, and a bump plays a soft thud.","makeItYours":["Who is the hero: a pixel cat, a little robot, or a jumping pancake?","What do you jump over: blocks, puddles, or sleeping dogs?","Where are you running: a neon city, a jungle, or a candy land?","Double jump allowed: yes or no?","What do you collect: coins, gems, or tiny hearts?"],"levelUp":["Add a shop where coins unlock new hero colors (no real money, just game coins).","Add flying obstacles you must duck under.","Add day and night that change as you run farther."],"buildNotes":"Canvas loop with gravity and jump velocity, obstacles spawned at random gaps and moved left, parallax background layers, box collision, distance and coins in localStorage, Web Audio sounds."},{"id":"arcade-glow-pad-memory","title":"Glow Pad Memory","pitch":"Watch the pads light up and play the same pattern back.","kind":"game","ages":["kid"],"themes":["arcade","music"],"size":"small","howItWorks":"Four big glowing pads sit in a square, each with its own color and sound. The game lights up a short pattern, and you tap the pads in the same order. Get it right and the pattern grows by one more step. Get it wrong and you see how long a pattern you remembered.","lookAndFeel":"Four huge rounded pads in red, blue, green, and yellow that glow brightly when lit, on a dark arcade background. Each pad plays its own musical note, so patterns sound like little songs. A wrong tap plays a gentle wobble, not a harsh buzz.","makeItYours":["What are the pads: plain colors, animal faces, or space shapes?","What sounds do they play: piano notes, animal sounds, or drum beats?","How many pads: 4 for starters, 6, or 9 for experts?","How fast does the pattern play: slow, medium, or quick?","What happens at a new best: confetti, a dance, or a trophy?"],"levelUp":["Add a free play mode to make your own little songs on the pads.","Add a two-player mode where players take turns adding one step.","Add a backwards mode where you play the pattern in reverse."],"buildNotes":"Four DOM buttons with CSS glow states, sequence array with async playback using timeouts, input checking per tap, Web Audio oscillator notes per pad, best length in localStorage."},{"id":"arcade-maze-key-dash","title":"Maze Key Dash","pitch":"Race through a glowing maze to grab the keys and reach the door before time runs out.","kind":"game","ages":["kid"],"themes":["arcade"],"size":"small","howItWorks":"A top-down neon maze fills the screen with a few keys and a locked door. You move your little hero with arrows or on-screen buttons to collect every key, which unlocks the door. Reach the door before the timer ends to win the level. Each new level is a fresh maze that is a bit bigger.","lookAndFeel":"Glowing blue maze walls on black, the hero as a bright round pixel buddy, keys as spinning yellow pixel keys. The door glows red when locked and green when open. Picking a key plays a sparkle, and the door opening plays a short tune.","makeItYours":["Who is the hero: a pixel bunny, a glowing ball, or a tiny explorer with a lantern?","What do you collect: keys, crystals, or lost puppies?","Should there be a timer, or a relaxed mode with no timer?","Add some friendly hurdles: sticky slime tiles, sliding ice, or doors that open and close?","Maze colors: blue neon, pink and purple, or green like an old screen?"],"levelUp":["Add a fog mode where you only see near your hero.","Add two players racing in the same maze on one keyboard.","Add stars per level for finishing fast."],"buildNotes":"Maze generated with a depth-first carving algorithm on a grid, keys placed in random dead ends, tile-by-tile movement with key and swipe input, canvas drawing with shadowBlur glow, best times in localStorage."},{"id":"arcade-family-scoreboard","title":"Neon Scoreboard","pitch":"Keep score for family games on a flashy arcade high-score board.","kind":"tool","ages":["kid","teen"],"themes":["arcade","sports"],"size":"small","howItWorks":"You add the players with three-letter arcade initials and pick a game, like a board game, a card game, or backyard ball. Big plus and minus buttons change each player's score during the game. When you finish, the winner gets a flashing crown and the result goes into the hall of fame list for that game, which is remembered on the device.","lookAndFeel":"A retro high-score screen with glowing pixel-style letters made with CSS, chunky colorful buttons, and a scrolling star background. Scores flip like an arcade counter. Each point plays a coin blip, and the winner screen plays a little victory jingle.","makeItYours":["What games do you keep score for: board games, card games, or sports in the yard?","How do players show up: initials, emoji avatars, or pixel faces you pick?","What does the winner get: a crown, a trophy, or fireworks?","Should scores count up, or count down to zero for some games?","Color style: hot pink and cyan, gold and black, or green retro screen?"],"levelUp":["Add a round-by-round table so you can see each round's points.","Add a dice roller and a turn timer.","Add stats showing wins per player per game."],"teenTwist":"Add custom score rules per game (target score, lowest wins, rounds), a round history with undo, and win-rate stats per player.","buildNotes":"Plain DOM app with players and games stored as objects in localStorage, initials only (no real names needed), CSS text-shadow glow, Web Audio coin and jingle."},{"id":"arcade-reflex-duel","title":"Reflex Duel","pitch":"Two players race to tap their button the moment the light turns green.","kind":"game","ages":["kid"],"themes":["arcade","sports"],"size":"small","howItWorks":"The screen is split in two, one big button for each player at either end of the tablet or on two keys. A light in the middle stays red for a random short time, then turns green. The first player to tap after it turns green wins the round, but tapping too early gives the point to the other player. First to five points wins the match.","lookAndFeel":"Two big glowing buttons in different colors, a traffic-light style signal in the middle, and big score numbers. The winner's side flashes and plays a happy sound, an early tap plays a silly oops. Characters on each side cheer or flop dramatically.","makeItYours":["What are the two sides: two robots, a cat and a dog, or two race cars?","What is the signal: a green light, a popping balloon, or a rooster crow?","How many points to win: three, five, or ten?","Solo mode: race against a computer player with a speed you choose?","What is the early tap penalty: lose a point, or freeze for a moment?"],"levelUp":["Add tricky fake signals like a blue light you must not tap.","Add a reaction time shown in milliseconds with a best time.","Add a tournament for up to four players taking turns."],"buildNotes":"Two big pointer targets plus keyboard keys (like A and L), random delay with setTimeout, timestamp with performance.now for reaction time, multi-touch support, Web Audio sounds, best reaction in localStorage."},{"id":"arcade-platform-level-maker","title":"Platform Level Maker","pitch":"Design your own jump-and-run level, then play it to see if it is possible.","kind":"creative","ages":["teen"],"themes":["arcade"],"size":"medium","howItWorks":"In build mode you paint tiles onto a grid: ground, platforms, bounce pads, coins, a start, and a goal flag. Press play and a small hero appears at the start, and you run and jump through your own level with keys or touch buttons. Reach the flag to finish, then switch back to tweak the level. Levels are saved on the device in a level list.","lookAndFeel":"Pixel tiles with a neon edge glow, a dark background with a parallax grid. The editor has a tile toolbar along the bottom and a grid overlay that hides in play mode. Jumps, coins, and the goal each have their own chiptune-style sound.","makeItYours":["What tiles do you want: bouncy pads, ice that slides, or disappearing blocks?","Who is the hero: a pixel fox, a robot, or a cube with a face?","How does the hero move: big floaty jumps, quick tight jumps, or double jump?","What is the goal: a flag, a portal, or a trophy?","How big can a level be: one screen, or a long scrolling level?"],"levelUp":["Add moving platforms with a path you draw.","Add a timer and best time per level.","Add a level code you can copy and paste on the same device to duplicate and remix levels."],"teenTwist":"Expose physics settings like gravity, jump strength, and run speed as sliders, add tile-based collision you can debug with a hitbox view, and track best time per level.","buildNotes":"Tilemap as a 2D array, editor with pointer painting, play mode with canvas loop, axis-separated tile collision, camera following the hero, levels saved as JSON in localStorage, Web Audio square-wave sounds."},{"id":"arcade-beat-lane-tapper","title":"Beat Lane Tapper","pitch":"Tap the lanes in time as glowing notes fall to the beat.","kind":"game","ages":["teen"],"themes":["arcade","music"],"size":"medium","howItWorks":"Four lanes run down the screen with a hit line near the bottom. A song made by the app plays, and notes fall down the lanes in time with it. You tap the lane or press D, F, J, K as each note crosses the line, getting perfect, good, or miss. Streaks build a combo, and each song keeps your best score and accuracy.","lookAndFeel":"Neon lanes in four colors on black, with notes as glowing bars and a burst of light on each hit. The background pulses with the beat. Music is built from Web Audio drums, bass, and a lead synth, with a click track option for practice.","makeItYours":["What style of music: upbeat chiptune, chill beats, or fast dance?","How many lanes: three for easy, four, or six for experts?","What do notes look like: bars, stars, or pixel hearts?","Difficulty choices: slow, normal, or hard with double notes?","What happens on a long combo: the screen flashes, a crowd cheers, or the colors shift?"],"levelUp":["Add a chart editor where you tap along to record your own note pattern.","Add hold notes you keep pressed.","Add a results screen with an accuracy graph."],"teenTwist":"Schedule notes with the AudioContext clock for tight timing, add a latency calibration step, and show accuracy stats with perfect and good windows in milliseconds.","buildNotes":"Songs defined as BPM plus note arrays, Web Audio scheduler using audioContext.currentTime lookahead, note positions computed from song time rather than frame count, canvas rendering, best scores per song in localStorage."},{"id":"arcade-light-trail-racers","title":"Light Trail Racers","pitch":"Two racers leave glowing trails, and you must not crash into any trail.","kind":"game","ages":["teen"],"themes":["arcade","cars"],"size":"small","howItWorks":"Two light racers zoom across a dark grid, each leaving a solid glowing trail behind. Player one steers with WASD and player two with the arrow keys, or one player races a computer opponent. Hitting a wall or any trail ends the round, and the last racer still moving wins. First to three round wins takes the match.","lookAndFeel":"A dark blue grid floor, one racer in cyan and the other in orange, with bright trails and a soft glow. Crashes become a burst of pixel sparks with a short fizz sound. A countdown of three beeps starts each round.","makeItYours":["Who races: two players, you against the computer, or up to four with shared keys?","How fast: cruise, quick, or hyper?","Arena: open square, with blocks in the middle, or a shrinking arena?","Trail colors: cyan and orange, pink and lime, or pick your own?","Power-ups: a short speed boost, a jump over one trail, or none?"],"levelUp":["Add a computer racer with easy, medium, and hard brains.","Add arenas with obstacles to choose from.","Add a match history with wins per color."],"teenTwist":"Write a computer opponent that looks ahead to avoid walls and picks the side with the most open space, with difficulty set by how far it looks ahead.","buildNotes":"Grid of occupied cells, fixed-tick update moving each racer one cell, collision by checking the grid, canvas drawing with shadowBlur, two key sets on one keyboard plus on-screen arrows for touch, Web Audio beeps, match stats in localStorage."},{"id":"cars-car-designer","title":"Dream Car Garage","pitch":"Design your own car with cool wheels, colors and stickers, then take it for a test drive!","kind":"creative","ages":["kid"],"themes":["cars"],"size":"small","howItWorks":"A car sits on a lift in a garage with big picture buttons for body shape, wheels, spoiler, paint and stickers. Tapping a button cycles through choices and the car changes instantly. A big green go button sends the car zooming across a road scene and back into the garage, and your car is saved for next time.","lookAndFeel":"The car is built from SVG pieces: rounded bubble cars, long racers, chunky trucks, with big friendly headlight eyes if the kid wants. A bright garage with a checkered floor, tool wall and hanging lights. Each change makes a ratchet click, paint makes a spray sound and the test drive plays a revving engine sound made with Web Audio.","makeItYours":["What kind of car do you want: a race car, a monster truck, or a tiny bubble car?","Should your car have a face with eyes: yes, no, or only when it drives?","What stickers can you add: flames, stars, or a racing number?","Where does the test drive go: a city street, a desert, or a rainbow road?","What sound does your car make: vroom, beep beep, or a funny honk?"],"levelUp":["A parking lot that shows all your saved cars side by side","Special parts like wings, rocket boosters or giant wheels","A paint mixer where you blend two colors"],"buildNotes":"SVG car assembled from swappable part groups; CSS transform animation for the test drive with spinning wheels; Web Audio sawtooth oscillator with rising pitch for the engine; localStorage for saved designs. No real car brands or models."},{"id":"cars-car-wash","title":"Bubble Car Wash","pitch":"Muddy cars roll into your car wash, and you scrub, rinse and dry them until they sparkle!","kind":"game","ages":["kid"],"themes":["cars","nature"],"size":"small","howItWorks":"A muddy car drives into the wash bay and a row of big tool buttons appears: soap, brush, water hose and dryer. The player picks a tool and rubs over the car with a finger or mouse to clean away mud spots, and each step has to be finished before the next one lights up. A clean car shines, honks happily and drives off, and the next car arrives a little muddier.","lookAndFeel":"A cheerful car wash with striped awnings, foamy bubbles that float up and big spinning brushes. Mud is drawn as brown blobs on a canvas layer that gets erased as you scrub. Scrubbing plays a squishy sound, the hose makes a whoosh, and the finished car sparkles with a twinkle sound.","makeItYours":["Who comes to your car wash: race cars, monster trucks, or ice cream vans?","What makes them dirty: mud, splashed paint, or melted chocolate?","What color are the bubbles: rainbow, pink, or blue?","What does the car do when it's clean: honks, does a wheelie, or says thank you?","Should there be a timer: no, a relaxed one, or a fast rush hour?"],"levelUp":["A wax step that adds a shine sticker the kid chooses","Coins earned per car to buy new bubble colors and brushes","A rush hour mode with two cars at once"],"buildNotes":"Canvas mud layer erased with destination-out compositing while dragging; check the percentage of cleared pixels to finish a step; pointer events for touch and mouse; Web Audio noise for water; localStorage for cars washed count."},{"id":"cars-lane-dodge","title":"Lane Zoom","pitch":"Zoom down the road and switch lanes to dodge cones and grab stars!","kind":"game","ages":["kid"],"themes":["cars","arcade"],"size":"small","howItWorks":"A car drives up a three-lane road seen from above while the road scrolls down. The player taps the left or right side of the screen, swipes, or uses arrow keys to change lanes. Stars give points and traffic cones must be avoided; bumping a cone makes the car spin and lose one of three tires shown at the top, and losing all three ends the race with your score.","lookAndFeel":"Canvas road with dashed lane lines, grass on both sides with little trees and houses whizzing past. The player car is bright and round with a racing stripe. Changing lanes makes a swoosh, stars make a ding and bumping a cone makes a cartoon boing with the car spinning once.","makeItYours":["What do you collect on the road: stars, coins, or fruit?","What do you dodge: traffic cones, puddles, or sleepy turtles crossing slowly?","Where is the road: a city, a beach, or a snowy forest?","How many lanes: two for easy, three, or four for hard?","What special item helps you: a shield bubble, a magnet, or a turbo boost?"],"levelUp":["A night mode with headlights lighting up the road","Unlockable cars earned with stars","A finish line race mode with a set distance and a timer"],"buildNotes":"Canvas game loop with lane-based player position and tweened lane change; spawner for items and obstacles with increasing speed; swipe and tap detection plus keyboard; Web Audio sound effects; localStorage for best score."},{"id":"cars-traffic-lights","title":"Traffic Light Boss","pitch":"Be in charge of the traffic lights and let cars, buses and ducks cross the crossroads safely!","kind":"game","ages":["kid"],"themes":["cars","nature"],"size":"small","howItWorks":"A crossroads is shown from above with traffic coming from two directions and a crosswalk where a family of ducks sometimes waddles across. The player taps each traffic light to switch it between red and green. Cars wait at red and honk if they wait too long, and if two cars come too close they both stop with a beep and a puff of steam. Getting lots of cars through smoothly fills up a happy-town meter to finish the level.","lookAndFeel":"Toy-town style with rounded cars, a yellow school-bus-like bus, a big friendly bridge and green parks around the roads. The traffic lights are big and easy to tap. Honks are short playful beeps, ducks quack with a little chirp sound, and filling the happy meter plays a cheerful town jingle.","makeItYours":["Who crosses the road on foot: ducks, turtles, or penguins?","What vehicles drive through: cars and buses, tractors, or ice cream trucks?","Where is your crossroads: a city, a farm, or a toy town?","How busy should it get: calm, busy, or super crazy rush hour?","What happens when you do great: fireworks, the mayor cat gives you a medal, or the town lights up?"],"levelUp":["A second crossroads with more lights to manage","Special vehicles like a fire truck that needs a clear path","A day counter that makes the town grow new buildings"],"buildNotes":"Canvas top-down scene; cars as objects moving along fixed paths that stop when a light is red or a car is close ahead; tap targets on lights; Web Audio honks and quacks; localStorage for best level. No crashes, cars always stop safely."},{"id":"cars-parking-counting","title":"Number Parking Lot","pitch":"Solve the number on each car and park it in the spot with the answer!","kind":"learning","ages":["kid"],"themes":["cars"],"size":"small","howItWorks":"Cars drive in one at a time, each carrying a small sum or a group of dots on its roof. The player drags the car into the parking spot that shows the right number. A correct park makes the car beep and turn off its lights, and a wrong spot makes it gently roll back out to try again. When all spots are filled the lot does a light show, and the next level uses bigger numbers.","lookAndFeel":"A parking lot seen from above with big numbered spots in bright painted colors. Cars are chunky and colorful with roof signs that show dots for the youngest players or numbers for older ones. A soft beep for correct, a gentle wobble for wrong, and a celebratory honk chorus at the end of each level.","makeItYours":["What should the math be: counting dots, adding, or taking away?","How big can the numbers get: up to 5, up to 10, or up to 20?","What drives into the lot: cars, buses, or race cars?","What happens when the lot is full: a light show, a parade, or confetti?","Should there be a timer: no timer, a relaxed one, or a fast challenge?"],"levelUp":["A difficulty picker with pictures for each level","A sticker collection that grows as levels are finished","A shapes mode where cars match triangle, circle and square spots"],"buildNotes":"SVG or DOM-based drag and drop with pointer events and snapping to spots; question generator by difficulty; Web Audio beeps; localStorage for progress and stickers. Keep words minimal so pre-readers can play."},{"id":"cars-draw-a-track","title":"Draw-a-Track Racer","pitch":"Draw any road you like with your finger, then watch your car race along it!","kind":"creative","ages":["kid","teen"],"themes":["cars","arcade"],"size":"medium","howItWorks":"The screen is a big empty field where the player draws a road with a finger or mouse, and the line turns into a proper road with edges and a dashed center line. A start button sets a car driving along the road, going faster on straight parts and slower in tight curves. Players can add decorations like trees, ramps and a finish arch, and save their favorite tracks.","lookAndFeel":"A grassy or sandy field background, the road drawn as thick dark gray strokes with white dashes, and a small top-down car that turns smoothly with the road. Decorations are emoji-sized SVG trees, flags and cones. Engine sound pitch rises with speed, and crossing the finish arch plays a fanfare.","makeItYours":["What surface are you drawing on: grass, a desert, or a snowy field?","What does your road look like: normal asphalt, a rainbow road, or a dirt track?","What decorations can you add: trees, ramps, or cheering flags?","How many cars race on your track: just one, two, or a whole parade?","What happens at the finish line: fireworks, a trophy, or the car does donuts?"],"levelUp":["A lap timer that shows how long one lap takes on your track","A second car that you control yourself while the first drives on its own","Saved tracks gallery with mini previews"],"teenTwist":"Make the car speed depend on curve sharpness with a grip setting, show lap times, and challenge the teen to design the fastest track that still has a set number of turns.","buildNotes":"Capture pointer points, smooth them, and draw a thick path on canvas; move the car by arc length along the path with heading from the path tangent; curvature-based speed; localStorage for saved tracks as point arrays."},{"id":"cars-parking-puzzle","title":"Traffic Jam Escape","pitch":"Slide the cars and trucks out of the way so your car can drive out of the jam!","kind":"game","ages":["kid","teen"],"themes":["cars"],"size":"small","howItWorks":"A square parking lot grid is packed with cars and trucks that can only slide forward or backward along their own direction. The player drags them to make a clear path for the special car to reach the exit gate. Levels go from easy to brain-twisting, and a move counter shows how many slides you used.","lookAndFeel":"Top-down chunky blocks styled as cars with windshields and wheels, trucks taking three squares. The player car is a bright color with a star on the roof. Sliding makes a short rolling sound, blocked moves make a soft bump, and escaping plays a happy horn and the gate lifts.","makeItYours":["What is your special car: a race car, an ice cream truck, or a tiny bubble car?","Where is the jam: a parking lot, a ferry deck, or a busy garage?","How hard should the first levels be: super easy, medium, or tricky right away?","Should there be a hint button: yes, only after a while, or never?","What happens when you escape: confetti, the car zooms off, or a medal?"],"levelUp":["A star rating for finishing in the fewest moves","A level maker to design and save your own jams","An undo button and a reset button with a move history"],"teenTwist":"Show the minimum number of moves for each level, add a built-in solver hint that searches for the best solution, and let teens design puzzles that the solver rates by difficulty.","buildNotes":"Grid with vehicles as objects with position, length and orientation; drag constrained to one axis with collision checks; levels stored as compact strings; optional breadth-first search solver; localStorage for completed levels and best moves."},{"id":"cars-tap-race","title":"Two-Player Turbo Race","pitch":"Race a friend on the same screen by tapping your button as fast as you can!","kind":"game","ages":["kid","teen"],"themes":["cars","sports"],"size":"small","howItWorks":"The screen is split with one big button for each player, one at each end, and a race track in the middle showing two cars. Each tap pushes your car forward, and keyboard players can use two different keys. Halfway there is a pit stop moment where you must stop tapping when the light turns red or your car slows down. The first car across the finish line wins, and the win count is shown for each side.","lookAndFeel":"A bird's-eye oval or straight drag strip in bright colors, each car in its player's color with a big number. A start light counts down with three beeps and a high go tone. Tapping makes a quick engine buzz, and the winner's side lights up with confetti and a trophy animation.","makeItYours":["What kind of track: a straight drag strip, a round oval, or a bumpy dirt road?","What colors are the two cars: red and blue, green and orange, or you pick?","What trick should be halfway: a red-light stop, a jump ramp, or an oil slick to wait for?","How long should a race be: short and quick, medium, or a long marathon?","What does the winner get: a trophy, a victory song, or a crown on the car?"],"levelUp":["A one-player mode against a computer car with three speeds","Best of three or five rounds with a scoreboard","Choose a car with different stats like quick start or high top speed"],"teenTwist":"Replace pure tapping with a rhythm-timed shifting system where perfect gear shifts at the right moment beat button mashing, with stats on reaction time.","buildNotes":"Split layout with two large touch zones that support simultaneous multi-touch, plus two keyboard keys; car positions updated per tap with slight decay; Web Audio for countdown and engine; localStorage for win tallies."},{"id":"cars-road-trip-story","title":"Road Trip Adventure","pitch":"Pick which way to drive on a road trip and see what fun surprises you find!","kind":"story","ages":["kid","teen"],"themes":["cars","nature"],"size":"small","howItWorks":"A little car starts in a garage, and each page shows where it is and two or three road signs to choose from, like mountain road or beach road. Each choice leads to a new scene with a small event, such as a flat tire to fix, a kind traveler to help or a giant hill to climb. The trip can end at different places like a camping spot, a seaside fair or a hidden waterfall, and a map remembers every ending you found.","lookAndFeel":"Postcard-style SVG scenes with rolling hills, bright skies and a little car that drives in from the side on every new page. Road signs are the choice buttons, with icons for young players. A light engine hum plays between scenes and each ending plays a different short tune.","makeItYours":["Who is in the car: a family of foxes, a robot driver, or a grandma and her dog?","What kind of car is it: a camper van, an old jeep, or a tiny race car?","What places can you visit: mountains, a beach, or a big city?","What surprise can happen on the way: a flat tire, a rainstorm, or a parade?","What should the best ending be: a campfire under the stars, a fair, or a secret waterfall?"],"levelUp":["A fuel gauge that makes some routes only possible after a gas stop","A souvenir collection from each place you visit","A postcard maker that saves a picture of each ending"],"teenTwist":"Add a budget, fuel and time system so each route choice is a trade-off, and let the teen write new branches in a simple built-in story editor.","buildNotes":"Scenes as a JSON graph with choices; SVG scenes built from reusable landscape pieces; CSS animation for the car arriving; localStorage for found endings and souvenirs; Web Audio tunes."},{"id":"cars-pit-stop-strategy","title":"Pit Crew Boss","pitch":"Plan tires, fuel and pit stops to help your racing team win the big race.","kind":"game","ages":["teen"],"themes":["cars","sports"],"size":"medium","howItWorks":"Before the race the player picks a tire type (soft, medium, hard), a starting fuel load and a plan for when to pit. The race then plays out as a simulated lap-by-lap view on a small track map with rival cars, where tires wear down, fuel weight changes lap times and random weather can turn the track wet. During the race the player can call a pit stop and play a quick timing mini-game to change tires, and the final position and lap chart are shown at the end.","lookAndFeel":"A clean pit wall dashboard look: a small top-down track on the left, live timing tower with positions on the right, tire wear and fuel bars in the middle. Dark gray with neon team colors. Engine whooshes as cars pass, a radio-style beep for strategy calls, and an air-wrench sound during the pit stop mini-game.","makeItYours":["What is your team called and what are its colors: Team Comet in blue, Thunder in yellow, or your own idea?","How long is the race: a 10-lap sprint, 25 laps, or a long endurance race?","What surprises can happen: rain, a safety car period, or tire punctures?","How should pit stops work: automatic, a timing tap mini-game, or a full crew task list?","What track shape do you want: a twisty city circuit, a fast oval, or a mountain road?"],"levelUp":["A season mode with several races and a points table","Car setup sliders like wing angle that trade speed for grip","A strategy replay chart that compares your plan to a perfect one"],"teenTwist":"The whole game is a systems model of tire wear curves, fuel weight and pit time loss, so teens can experiment with numbers and find the optimal strategy.","buildNotes":"Lap-time formula from base pace, tire wear, fuel load and weather, simulated per lap with a speed-up control; canvas track with cars as dots along a path; timing tower as DOM; localStorage for season results. Rivals and teams are fictional."},{"id":"cars-speed-lab","title":"Car Speed Lab","pitch":"Experiment with engine power, weight and tires to see how they change speed and braking.","kind":"learning","ages":["teen"],"themes":["cars","space"],"size":"small","howItWorks":"The screen shows a straight test track and sliders for engine power, car weight, tire grip and air drag. Pressing Run launches the car from a standstill, measures 0 to 100 time, top speed and braking distance, and draws a live speed-over-time graph. Each run is saved as a colored line so runs can be compared, and challenge cards ask things like reach 120 in under 6 seconds with the lightest engine.","lookAndFeel":"A lab-style interface with a side view of the car on a test strip with distance markers, and a graph panel underneath. Cool blue and white palette with each run in its own color. Engine pitch rises with speed and a short chirp marks each measurement point.","makeItYours":["What do you want to test: a race car, a heavy truck, or a car on the moon?","Which sliders should exist: power and weight, plus grip and drag, or also slope?","What units should it use: kilometers per hour, miles per hour, or both?","What challenges should the lab give: speed goals, braking goals, or efficiency goals?","How should results show: a line graph, a bar chart, or a race between ghost cars?"],"levelUp":["A planets setting that changes gravity for braking tests","Ghost cars that replay saved runs side by side","A formula panel that shows the math behind each result"],"teenTwist":"Show the actual equations (force equals mass times acceleration, drag growing with speed squared) and let teens predict results before running the test.","buildNotes":"Fixed time-step physics integration with engine force, drag and rolling resistance; canvas side view and line chart drawn by hand; localStorage for saved runs and completed challenges."},{"id":"cars-lap-timer","title":"Lap Timer Pro","pitch":"Time your laps for toy car races, bike rides or running, and see your best lap.","kind":"tool","ages":["teen"],"themes":["cars","sports"],"size":"small","howItWorks":"A big start button begins the timer and a huge lap button records each lap, showing lap times in a list with the best lap highlighted and the difference from the best. Sessions can be named (like backyard track) and saved on the device, and a stats view shows average lap, best lap and a small bar chart of all laps. A countdown start with beeps makes races fair for friends taking turns on the same device.","lookAndFeel":"A racing dashboard style with a big digital-looking timer, dark background and bright green and purple highlights for personal bests. Buttons are large enough to hit while watching a race. A short beep on each lap, a higher double beep on a new best and a countdown of three tones at the start.","makeItYours":["What will you time most: toy car races, bike laps, or running laps?","What should the dashboard look like: race car cockpit, clean and simple, or retro arcade?","Should it support several racers taking turns: yes with a racer list, or just one?","What stats matter: best lap, average lap, or how consistent your laps are?","What sound on a new best lap: a double beep, a fanfare, or a crowd cheer?"],"levelUp":["A racer list with nicknames and a personal best leaderboard on this device","A target time mode that tells you if each lap is ahead or behind","Export of results as text you can copy"],"teenTwist":"Add consistency stats like standard deviation and a lap trend chart so it becomes a real training tool for spotting improvement over sessions.","buildNotes":"performance.now() based timing with requestAnimationFrame display; laps array per session; canvas or SVG bar chart; Web Audio beeps; localStorage for named sessions. Nicknames only, no personal details."},{"id":"music-animal-orchestra","title":"Animal Orchestra","pitch":"Tap the animals to wake them up and they sing together in a silly band.","kind":"creative","ages":["kid"],"themes":["music","nature"],"size":"small","howItWorks":"A stage shows five sleeping animals, each with its own short tune: a drum beat, a bass line, a little melody, a high twinkle and a clap. Tap an animal to wake it up and it joins the song right on the beat; tap again and it goes back to sleep. Every mix of awake animals makes a different song, and a big conductor button starts or stops the whole band.","lookAndFeel":"Round, simple animals drawn in SVG with big eyes that close with a little Zzz when asleep and bounce to the beat when awake. A warm stage with red curtains and a spotlight that glows over each singing animal. Each animal sound has its own color note that floats up when it plays.","makeItYours":["Which animals are in your band: frogs, cats, or penguins?","What does each animal play: drums, a happy tune, or a deep bass?","Where is the show: a forest stage, under the sea, or on the moon?","How fast is the band: slow and sleepy, middle, or super fast?","What happens when all animals are awake: confetti, a big cheer, or the stage lights flash?"],"levelUp":["A second song so the band can switch between a happy tune and a calm lullaby.","A volume knob for each animal so you can make one louder or softer.","Save your favorite band mix with a name and load it again later."],"buildNotes":"Web Audio loops scheduled on a shared clock so every part starts on the next bar; each animal is an SVG button toggling a looping pattern of oscillator notes or a synthesized drum. Store saved mixes in localStorage."},{"id":"music-rainbow-xylophone","title":"Rainbow Xylophone","pitch":"Play a rainbow xylophone and follow the glowing bars to learn a song.","kind":"creative","ages":["kid"],"themes":["music","unicorns"],"size":"small","howItWorks":"Eight rainbow bars fill the screen, from a long low red bar to a short high purple bar, and you tap them (or press keys 1 to 8) to play notes. In free play you just make music; in follow mode a bar glows to show the next note of a simple tune like Twinkle Twinkle or Mary Had a Little Lamb, and the tune moves on when you tap the right bar. Finishing a song makes a sparkle shower and adds a star to that song.","lookAndFeel":"Chunky rounded bars in bright rainbow colors on a soft cloudy sky, with two little mallets that swing when you tap. Each tap makes a ripple and a small colored note that floats away. A clear bell-like sound for every bar.","makeItYours":["What color order do the bars use: rainbow, ocean blues, or candy colors?","What sound do the bars make: a bell, a soft flute, or a funny robot beep?","Which songs can you learn: Twinkle Twinkle, Hot Cross Buns, or one you make up?","Who cheers when you finish: a unicorn, a rainbow cat, or a smiling sun?","Do the bars show letters, numbers, or just colors?"],"levelUp":["A record button that remembers the notes you played and plays them back.","A song maker where you tap bars to write your own tune for follow mode.","More bars so you can play higher and lower notes."],"buildNotes":"Each bar triggers a short oscillator note (triangle or sine with a quick decay envelope) on a C major scale; follow mode is an array of note indices with the current one highlighted. Keep stars per song in localStorage."},{"id":"music-copy-cat-tunes","title":"Copy Cat Tunes","pitch":"Listen to the birds sing, then sing it back by tapping the same birds.","kind":"game","ages":["kid"],"themes":["music","nature"],"size":"small","howItWorks":"Four birds sit on a branch, each with its own color and note. The birds sing a short tune one note at a time, then it is your turn to tap the same birds in the same order. Every time you get it right the tune grows by one note; a mistake ends the round and shows how long a tune you remembered, with your best saved.","lookAndFeel":"Four plump round birds drawn in SVG on a curvy branch, each one puffing up and opening its beak when it sings. A gentle green park background with a sun that grows brighter the longer your streak. A cheerful chirp sound for a right answer and a soft wobble sound for a mistake.","makeItYours":["Who sings the tune: birds, frogs, or robots?","How many singers are there: 3 for easy, 4, or 6 for hard?","How fast do they sing: slow, medium, or speedy?","What do you win at a long tune: a golden feather, a crown, or fireworks?","Should a mistake end the game, or give you one more try?"],"levelUp":["A two player mode where you take turns and the longer tune wins.","A reverse mode where you tap the tune backwards.","Different tunes for each singer, like a bird that sings two notes at once."],"buildNotes":"Sequence array grows by one random index each round; play it with setTimeout-scheduled oscillator notes while highlighting the matching SVG, then compare taps. Best score in localStorage."},{"id":"music-high-or-low","title":"Rocket High Low","pitch":"Listen to two sounds and help the rocket fly up for high or down for low.","kind":"learning","ages":["kid"],"themes":["music","space"],"size":"small","howItWorks":"The game plays two notes, one after the other. You tap the big up arrow if the second note was higher, or the down arrow if it was lower, and the rocket flies up or dips down to match. Ten questions make a trip; each right answer moves the rocket closer to a planet, and the notes get closer together as you improve.","lookAndFeel":"A friendly round rocket with a face and a flame tail, flying past twinkling stars on a deep blue sky. Big arrow buttons with no words needed, and a replay ear button to hear the notes again. A happy whoosh when you are right and a little boing when you are not.","makeItYours":["Who flies: a rocket, a bird, or a hot air balloon?","Where are you going: the moon, a candy planet, or a star castle?","What sounds do you hear: a piano, a whistle, or a robot voice?","How many questions in one trip: 5, 10, or 20?","Should there be a third button for same?"],"levelUp":["A three note mode: does the tune go up, down, or up then down?","A sticker book of planets you reached, saved on this device.","A tricky level where both notes play at the same time."],"buildNotes":"Pick two frequencies with an interval that shrinks with the player's streak, play them with scheduled oscillator notes, and animate an SVG rocket with CSS transforms. Save planets reached in localStorage."},{"id":"music-freeze-dance","title":"Freeze Dance Party","pitch":"Tap to dance while the music plays, and freeze fast when it stops.","kind":"game","ages":["kid"],"themes":["music","arcade"],"size":"small","howItWorks":"A bouncy tune plays and your dancer moves every time you tap the big dance button, earning a point for each move. Without warning the music stops: stop tapping right away and you earn a freeze bonus, but tapping during the quiet loses a heart. Three hearts per party; the tune gets faster each round and the best score is saved.","lookAndFeel":"A cartoon dancer drawn with simple SVG shapes that switches between fun poses on each tap, on a disco floor with colored tiles that light up. When the music stops the lights go blue and the dancer wobbles like a statue. Hearts and score are big and easy to see.","makeItYours":["Who is the dancer: a robot, a dinosaur, or a jelly blob?","What kind of tune plays: a bouncy march, a fast beat, or a slow wiggle?","Where is the party: a disco, a beach, or a spaceship?","How many hearts do you get: 1, 3, or 5?","What happens at the end: a dance trophy, a crowd cheer, or a pile of balloons?"],"levelUp":["Special dance moves when you tap different colored buttons.","A two dancer mode where each player has their own side of the screen.","Sneaky fake stops where the music only gets quiet for a moment."],"buildNotes":"Generate a looping tune with scheduled oscillators and drum hits; stop it at random times and track taps against a stopped flag. Pose swaps via CSS classes on SVG groups; best score in localStorage."},{"id":"music-beat-grid","title":"Beat Grid Maker","pitch":"Tap squares on a grid to build your own drum beat that loops forever.","kind":"creative","ages":["kid","teen"],"themes":["music","robots"],"size":"small","howItWorks":"A grid of squares has a row for each drum sound (kick, snare, hi-hat, clap) and 16 steps across. Tap squares to light them up, press play, and a moving light runs across the grid playing every lit square in time. Change the speed, clear rows, and save your favorite beats with a name to load later.","lookAndFeel":"Glowing neon squares on a dark panel like a music machine, each row its own color with a little icon at the start. The playhead column glows brighter and lit squares pulse when they sound. A tempo dial and big play button sit along the bottom.","makeItYours":["Which sounds are in your rows: drums, animal noises made with beeps, or laser zaps?","How many steps across: 8 for simple, 16, or 32 for long beats?","What does the machine look like: a robot's chest, a neon panel, or a jungle drum set?","How fast can it go: slow, dance speed, or super fast?","Should there be a surprise button that makes a random beat?"],"levelUp":["A melody row with notes you can pick from a scale.","Several patterns you can chain into a whole song.","A swing knob that makes the beat bounce."],"teenTwist":"Add per-step volume, swing, a bass line row with note selection, and pattern chaining into an arranged song with A and B sections.","buildNotes":"Classic Web Audio step sequencer using a lookahead scheduler (setInterval plus audioContext.currentTime); drums synthesized from noise buffers and pitched-down oscillators. Grid state saved as arrays in localStorage."},{"id":"music-falling-notes","title":"Falling Notes","pitch":"Notes fall down the screen and you tap them right when they reach the line.","kind":"game","ages":["kid","teen"],"themes":["music","arcade"],"size":"medium","howItWorks":"Four colored lanes have notes sliding down toward a hit line at the bottom. Tap the lane (or press D, F, J, K) just as a note crosses the line to play it and score Perfect, Good or Miss. A short original tune plays out as you hit the notes, and at the end you get a star rating and a combo count, with best scores kept per song.","lookAndFeel":"Glowing gem-shaped notes on a dark stage with lanes that light up when tapped. Hit words pop up and fade, and a combo counter grows with a little shake. Each lane plays a different note so a good run sounds like a real melody.","makeItYours":["What falls down the lanes: gems, stars, or fruit?","How many lanes: 3 for easy, 4, or 5 for hard?","What kind of tune do you play: a happy march, a calm song, or a fast dance beat?","How do you win: get 3 stars, never miss, or reach a big combo?","What colors are the lanes: rainbow, ocean, or fire?"],"levelUp":["Long notes you must hold down.","A song editor where you tap along to make your own falling notes chart.","Easy, normal and hard versions of each song."],"teenTwist":"Add a chart editor that records taps against the beat grid, timing windows in milliseconds, accuracy percentages and a per-song leaderboard on the device.","buildNotes":"Canvas game loop driven by audioContext.currentTime so visuals stay in sync with scheduled oscillator notes; songs are arrays of {time, lane, pitch}. High scores in localStorage."},{"id":"music-practice-pal","title":"Practice Pal","pitch":"A helper that times your music practice, ticks a beat, and gives you stars.","kind":"tool","ages":["kid","teen"],"themes":["music","office"],"size":"small","howItWorks":"Pick what you are practicing from your own list (scales, a song, a tricky part), start the timer, and turn on the built-in metronome if you want a steady beat. When you stop, the session is saved with the date, minutes and what you worked on. A weekly chart shows your practice days, and you earn stars and a streak flame for practicing on many days.","lookAndFeel":"A friendly practice buddy character, like a metronome with eyes, that swings its arm on each beat. Soft calm colors, big start and stop buttons, and a row of seven days that fill with stars. A gentle chime when you reach your daily goal.","makeItYours":["Who is your practice buddy: a metronome with a face, a little owl, or a robot?","What is your daily goal: 10, 15, or 30 minutes?","What do you practice: piano, recorder, guitar, or singing?","What do you earn: stars, stickers, or pieces of a picture?","What sound does the beat make: a click, a wood block, or a soft drum?"],"levelUp":["A list of practice missions with a bonus challenge each day.","A tempo goal for a tricky part that goes up a little each week.","A monthly calendar view of all your practice."],"teenTwist":"Track target tempo per piece with a slow-to-fast ladder, show total hours per piece and a weekly trend chart, and let the user export the log as text to copy.","buildNotes":"Timer with Date.now, metronome via scheduled oscillator clicks with an accented first beat, sessions stored as an array in localStorage, and a simple SVG bar chart for the week."},{"id":"music-band-on-tour","title":"Band on Tour","pitch":"Help a little band travel to new towns and fix each town's music problem.","kind":"story","ages":["kid","teen"],"themes":["music","cars"],"size":"medium","howItWorks":"A small band rides a tour bus across a map of five towns. In each town a short story scene explains a problem, like a lullaby that is too fast for sleepy babies or a parade missing its drum, and you fix it with a little music puzzle: pick the right instrument, set the speed, or tap the missing notes. Solving it plays the fixed song, the town celebrates, and the bus drives on to the next stop until the big final concert.","lookAndFeel":"A cute bus and band members drawn in simple SVG shapes, with each town in its own color scheme like a snowy village or a beach town. Story text appears in short speech bubbles with big next buttons. Each town has its own short original tune that sounds broken before and right after.","makeItYours":["Who is in the band: animals, robots, or kids your age?","What do they ride: a bus, a hot air balloon, or a boat?","What is the band's name?","Which towns do they visit: a snowy town, a jungle town, or a town in the clouds?","What is the big final show: a concert on a mountain, a moon party, or a stadium?"],"levelUp":["A choice at each town that changes which town comes next.","A band member who joins after each town, adding a new sound to the final concert.","A sticker scrapbook of every town you helped."],"teenTwist":"Make the puzzles real music skills: identify the time signature, choose major or minor for the mood, fix a wrong note in a melody, or pick the chord that ends the song.","buildNotes":"Story as an array of scene objects with text, puzzle type and answer; each puzzle is a small reusable component using scheduled oscillator tunes. Save tour progress in localStorage."},{"id":"music-chord-explorer","title":"Chord Explorer","pitch":"Build chords on a piano, hear how they feel, and chain them into a song.","kind":"learning","ages":["teen"],"themes":["music"],"size":"small","howItWorks":"A two-octave piano keyboard sits under a panel where you choose a root note and a chord type (major, minor, seventh, suspended). The chord plays and its keys light up with note names and interval labels. Drop chords into four slots to build a progression, loop it with a simple beat, and try the preset common progressions to hear why they sound happy, sad or tense.","lookAndFeel":"A clean dark interface with a glowing piano where lit keys show colors by chord role (root, third, fifth, seventh). A circle of fifths wheel you can tap to pick roots. Soft pad-like synth sound that holds while the progression loops.","makeItYours":["What sound plays the chords: soft pad, plucky guitar-like, or electric piano?","Which chord types do you want: just major and minor, add sevenths, or everything?","How long is your progression: 4 chords, 8 chords, or a verse and chorus?","What color style: neon, warm wood, or minimal black and white?","Should it show mood words like happy, dreamy or tense next to each chord?"],"levelUp":["Arpeggio and strum patterns for the progression.","A key picker that shows which chords belong to the key, numbered I to vii.","A quiz mode: hear a chord and name its type."],"teenTwist":"Show Roman numeral analysis in any chosen key, voice-leading between chords, and let the user transpose a saved progression with one tap.","buildNotes":"Compute chord notes from semitone offsets and play them with several detuned oscillators through a gain envelope and lowpass filter; progression loop on a lookahead scheduler. Saved progressions in localStorage."},{"id":"music-synth-lab","title":"Synth Lab","pitch":"Make your own electronic sound with knobs and see the wave move as you play.","kind":"creative","ages":["teen"],"themes":["music","robots"],"size":"medium","howItWorks":"An on-screen keyboard (and the computer keys) plays a synthesizer you design with controls for waveform, filter cutoff and resonance, attack and release, and a simple echo. A live oscilloscope and frequency bars show what your sound looks like. Save sounds as named presets, and use an arpeggiator to play held notes up and down automatically.","lookAndFeel":"A retro hardware synth look with rotary knobs drawn in SVG, small LED lights and a green oscilloscope screen. Knobs turn by dragging up and down and show their value. Each preset gets a colored tag on a preset shelf.","makeItYours":["What style is the synth: retro wooden panel, futuristic neon, or a spaceship console?","Which controls matter most to you: filter, echo, or wobble?","What starter presets should it have: bass, lead, bells, or alien noises?","Play with mouse, touch keyboard, or computer keys?","What does the screen show: a wave, bars, or a spinning circle?"],"levelUp":["An LFO that wobbles the filter or pitch.","Two oscillators you can detune against each other.","A tiny 8-step sequencer to play your sound in a loop."],"teenTwist":"Explain each control with a one-line tooltip on what it does to the waveform, and add a sound-matching challenge: hear a target sound and tweak knobs until yours matches.","buildNotes":"Web Audio graph: oscillator to BiquadFilter to gain envelope to delay feedback loop to an AnalyserNode drawn on canvas each frame. Presets saved as JSON in localStorage."},{"id":"music-beat-runner","title":"Beat Runner","pitch":"Run and jump over blocks that pop up right on the beat of the music.","kind":"game","ages":["teen"],"themes":["music","arcade"],"size":"medium","howItWorks":"A runner moves across a scrolling level while a generated beat plays, and every obstacle arrives exactly on a beat. Jump or slide with a tap, swipe or key; landing your action on the beat gives a timing bonus and keeps the multiplier up. The level gets faster and the music adds new layers as you go, and the run ends when you hit an obstacle, showing distance, accuracy and best score.","lookAndFeel":"A minimal geometric runner (a glowing cube or shape) on a neon city skyline that pulses with the kick drum. The ground flashes on each beat and the background color shifts when a new music layer joins. Clean score readout with an accuracy meter.","makeItYours":["What is the runner: a glowing cube, a skateboarding robot, or a comet?","What is the world: a neon city, an underwater cave, or outer space?","What music style: fast electronic, chill beat, or marching drums?","How hard is it: forgiving timing, normal, or strict on-beat only?","What do you collect between obstacles: notes, coins, or stars?"],"levelUp":["Several levels with different tempos and time signatures.","A level editor where you place obstacles on a beat grid.","Unlockable runner skins earned by distance, saved on the device."],"teenTwist":"Generate levels from the music pattern itself so obstacle types follow drum parts, and show timing stats in milliseconds early or late after each run.","buildNotes":"Canvas game loop synced to audioContext.currentTime; obstacles spawned from the same beat schedule that triggers synthesized drums. High scores and unlocks in localStorage."},{"id":"nature-busy-bee","title":"Busy Bee Dash","pitch":"Fly a little bee to the flowers and bring the nectar home to the hive.","kind":"game","ages":["kid"],"themes":["nature","arcade"],"size":"small","howItWorks":"A sunny meadow fills the screen with flowers that open one by one. The player taps or clicks where the bee should fly (or uses arrow keys); touching an open flower fills the bee's nectar pot, and flying back to the hive turns it into a honey drop. Little rain clouds drift by, and flying through one makes the bee slow and wobbly for a moment. Fill the honey jar with 10 drops before the sun sets to win the day.","lookAndFeel":"A round yellow-and-black striped bee with wiggly wings drawn in SVG, bobbing gently as it flies, over a soft green meadow with a blue sky and a sun that slowly moves across. Flowers pop open with a bounce, honey drops glow gold, and a happy buzzy chime plays for each drop made with Web Audio.","makeItYours":["Who is flying: a bee, a butterfly, or a hummingbird?","What are the flowers: daisies, tulips, or sunflowers?","What gets in the way: rain clouds, windy gusts, or sleepy snails on the path?","How many honey drops to win: 5 for easy, 10, or 20 for a big day?","What sound plays when you make honey: a buzz, a bell, or a little song?"],"levelUp":["Several days in a row, each with more flowers and faster clouds, and a sticker for each finished day","A second bee for a friend on the same device, each with their own hive and honey jar","A shop at the hive where honey buys new flower colors or a hat for the bee"],"buildNotes":"Canvas game loop with requestAnimationFrame; bee moves toward the tap or key direction with easing. Simple circle collisions for flowers, hive and clouds; Web Audio blips; best score in localStorage."},{"id":"nature-garden-painter","title":"Magic Garden Painter","pitch":"Stamp flowers, trees and animals to make your own garden picture.","kind":"creative","ages":["kid"],"themes":["nature","unicorns"],"size":"small","howItWorks":"A big empty garden scene (grass, sky, a little path) waits in the middle, with a row of picture stamps along the bottom: flowers, trees, bushes, a pond, a bunny, a bird, a ladybug. The kid picks a stamp and taps the scene to place it, can drag things to move them, and can make them bigger or smaller. A magic wand button makes all the flowers bloom and the animals do a little dance. The garden is saved so it is still there next time.","lookAndFeel":"Chunky, friendly SVG stamps with thick outlines and bright candy colors over a soft pastel sky. Stamps land with a squishy bounce and a soft pop sound; the magic wand sends sparkles across the picture with a twinkly Web Audio chime.","makeItYours":["What kind of garden: a flower garden, a vegetable patch, or a fairy garden?","Which animals visit: bunnies, birds, or a hedgehog?","What does the magic button do: make flowers bloom, make it rain sparkles, or turn day into night?","What colors should the sky be: blue, sunset orange, or rainbow?","Should stamps make a sound: a pop, a giggle, or a little note?"],"levelUp":["Several saved gardens, shown as small pictures on a gallery page","A day and night switch where fireflies glow and flowers close at night","Seasons: tap a button to see your garden in spring, summer, autumn or snow"],"buildNotes":"SVG scene with draggable stamp elements (pointer events for touch and mouse), a size slider for the selected stamp. Save the list of stamps and positions as JSON in localStorage."},{"id":"nature-animal-homes","title":"Who Lives Here?","pitch":"Help each animal find its home, like the bird to its nest.","kind":"learning","ages":["kid"],"themes":["nature"],"size":"small","howItWorks":"A few animals wait on one side of the screen and their homes are drawn on the other side: a nest, a beehive, a burrow, a pond, a shell. The kid drags each animal to the home it belongs to; a right match makes the animal hop in happily, and a wrong one makes it shake its head gently and slide back. When all animals are home, a short fun fact is shown with a picture and a new round starts with new animals. Very few words, so the youngest players can enjoy it.","lookAndFeel":"Soft, round SVG animals with big friendly eyes (bird, bee, rabbit, frog, snail, fish, squirrel) on a warm forest-and-meadow background. Each correct match plays that animal's made-up sound with Web Audio (a chirp, a buzz, a ribbit), and finishing a round sets off a gentle leaf confetti.","makeItYours":["Which animals should be in it: farm animals, forest animals, or sea animals?","How many animals per round: 3 for easy, 5, or 8 for tricky?","Should it show words under the pictures, or only pictures?","What happens when you finish: a dance party, a fun fact, or a star on your star board?","Who cheers for you: a wise owl, a happy frog, or the sun?"],"levelUp":["A second game mode: match animals to what they eat (bunny to carrot, bee to flower)","A collection book that fills with every animal you have matched","A tricky level where the homes are hidden behind leaves you tap to peek under"],"buildNotes":"SVG or DOM drag and drop with pointer events and drop zones; a small data array of animals, homes and one-line facts. Web Audio oscillator sounds; collected animals saved in localStorage."},{"id":"nature-ocean-cleanup","title":"Ocean Clean-Up Crew","pitch":"Steer a little boat and scoop up trash to make the sea sparkle.","kind":"game","ages":["kid"],"themes":["nature","arcade"],"size":"small","howItWorks":"A little cleanup boat floats on top of a cartoon sea, moving left and right with a finger drag or arrow keys. Bottles, cans and bags float up from below; the player lowers the net to scoop trash, but should let fish and turtles swim by safely (catching a fish just makes it splash free and costs a point). Every bit of trash cleaned makes the water bluer and brings back a new sea friend to the bottom of the screen. Clean up 20 pieces to make the whole ocean sparkle and win.","lookAndFeel":"A bright blue sea with gentle wave lines, a smiling red boat with a big net, and simple SVG sea friends: fish, a turtle, a crab, an octopus. The water color shifts from murky green to clear sparkly blue as you clean, with a splashy scoop sound and a happy bubble melody when a new sea friend appears.","makeItYours":["What do you drive: a boat, a little submarine, or a friendly whale with a net?","Which sea friends come back: fish, turtles, or dolphins?","How hard: slow and calm, normal, or super fast trash?","What do you call your ocean: Sparkle Bay, Blue Lagoon, or your own name for it?","What happens when you win: fireworks of bubbles, a dolphin jump, or a rainbow?"],"levelUp":["Sorting at the dock: drag each scooped item to the right recycling bin for bonus points","Different places to clean: a river, a beach, and the deep sea","A sea friend album that remembers every friend you brought back"],"buildNotes":"Canvas game loop with falling/rising objects and rectangle collision against the net; object types are trash or creatures. A cleanliness value interpolates the water color; Web Audio splashes; best score in localStorage."},{"id":"nature-lost-ducklings","title":"The Lost Ducklings","pitch":"Help Mama Duck find her five little ducklings in a picture story.","kind":"story","ages":["kid"],"themes":["nature"],"size":"small","howItWorks":"A short picture story where each page is a new place: the pond, the tall grass, the old log, the garden, the bridge. On each page one duckling is hiding somewhere in the picture, and the kid taps around to find it; when found, it joins the line walking behind Mama Duck. At some pages the kid chooses which way to go (left to the flowers or right to the stream), so the story can be read in different orders. The last page is a happy splash home with all ducklings together.","lookAndFeel":"Soft storybook drawings in SVG with gentle greens, sky blues and yellow ducklings, and one short line of big text per page that a grown-up or a new reader can read. Ducklings peep when found (a tiny Web Audio chirp), and the line of ducklings waddles across the page between scenes.","makeItYours":["Who is lost: ducklings, kittens, or baby turtles?","Where do they hide: in a forest, on a farm, or at the beach?","How many little ones: 3, 5, or 7?","What are their names: you choose silly names, food names, or color names?","How does the story end: a picnic, a splash in the pond, or a cozy nap?"],"levelUp":["A read-aloud mode that plays a little tune on each page and highlights the words","A harder hide-and-seek where the duckling moves to a new spot each time you play","A bonus page where the kid draws the family's new home with simple stamps"],"buildNotes":"A simple page engine: an array of scene objects with SVG drawings, a hidden tap target, and choice buttons that jump to another page. Track found ducklings in a variable; remember finished stories in localStorage."},{"id":"nature-tiny-terrarium","title":"Tiny Terrarium","pitch":"Build a little world in a glass jar and watch the critters move around.","kind":"creative","ages":["kid","teen"],"themes":["nature"],"size":"small","howItWorks":"A big glass jar sits in the middle of the screen. From a side tray the user drags in soil, sand, pebbles, moss, ferns, mushrooms, a little bridge and critters like snails, ladybugs and a tiny frog. Once placed, critters wander slowly around the jar, plants sway, and a day and night switch turns on a soft lamp glow and fireflies. The jar is saved and can be renamed and decorated with a label.","lookAndFeel":"A curved SVG glass jar with shiny highlights, earthy browns and many shades of green, with tiny cute critters that move a few pixels at a time. Soft ambient forest sounds can be toggled on (gentle Web Audio wind and drips), and droplets of mist appear on the glass when you press the water mister.","makeItYours":["What kind of world: a mossy forest, a desert with cactus, or an underwater jar?","Which critters live there: snails, ladybugs, or a tiny frog?","What shape is the container: a round jar, a tall bottle, or a fish bowl?","What special thing is inside: a tiny house, a bridge, or a glowing crystal?","What happens at night: fireflies, a moon in the glass, or critters falling asleep?"],"levelUp":["A shelf with several jars you can switch between","Plants that slowly grow a little each day you visit","A mister and light meter: plants look happier when you keep them misted and in the light"],"teenTwist":"Add a small simulation where humidity, light and soil type affect how well each plant grows, with a care log and a chart of the jar's health over time.","buildNotes":"SVG scene with drag and drop from a tray (pointer events), clip-path to keep items inside the jar, and a setInterval wander for critters. Save the jar contents as JSON in localStorage."},{"id":"nature-weather-maker","title":"Weather Maker","pitch":"Slide the sun, clouds and wind and see what weather you make.","kind":"learning","ages":["kid","teen"],"themes":["nature"],"size":"small","howItWorks":"A drawn landscape with a little house, a tree and a hill sits under a big sky. Sliders control sunshine, clouds, wind and temperature, and the scene reacts: lots of clouds make rain, cold plus rain makes snow, sun plus rain makes a rainbow, strong wind bends the tree and blows leaves. Challenge cards ask things like 'Make snow!' or 'Make a rainbow!' and give a star when the player gets there. The weather is all pretend and drawn, never real forecasts.","lookAndFeel":"A wide SVG or canvas scene with a sky that blends from bright blue to grey, animated rain drops, snowflakes, puffy clouds and a bending tree. A little weather character (a cloud with a face, or a sun) cheers on the challenges, and Web Audio makes soft rain noise and a whooshing wind.","makeItYours":["Where is the scene: a farm, a city street, or a beach?","Who lives there: a cat on the windowsill, a scarecrow, or a snowman that melts?","What special weather can you unlock: a rainbow, a thunderstorm with soft rumbles, or fog?","What do the challenges ask for: easy ones, tricky ones, or silly ones like 'snow in summer'?","Should the sliders have words, pictures, or both?"],"levelUp":["A water cycle view showing water going up from the sea, into clouds and down as rain","A pretend weekly forecast you make yourself and then play back like a weather show","Seasons that change the trees and the light"],"teenTwist":"Turn it into a mini weather model with a water cycle and simple rules for humidity, dew point and pressure, showing why each weather happens with small labels and a chart.","buildNotes":"Canvas particle systems for rain, snow and leaves driven by slider values; rules map the slider combination to a weather state. Web Audio filtered noise for rain and wind; earned stars in localStorage."},{"id":"nature-lily-pad-hop","title":"Lily Pad Hop","pitch":"Hop a frog across the moving lily pads to reach the other side of the pond.","kind":"game","ages":["kid","teen"],"themes":["nature","arcade"],"size":"small","howItWorks":"A frog sits on the bottom bank of a pond with rows of lily pads drifting left and right above it. Tap the frog, swipe, or press the arrow keys to hop forward, left or right; land on a pad and you ride along with it, miss and the frog does a splash and goes back to the last bank. Shiny dewdrops on some pads are bonus points. Reach the top bank to finish the level, then the next pond has faster pads and new surprises like turtles that briefly dive.","lookAndFeel":"A top-down cartoon pond in deep teal with round green lily pads, pink water lilies and a cheerful green frog drawn in SVG or canvas. Ripples spread when the frog lands, a boing sound plays with each hop, and a little splash and giggle plays on a miss.","makeItYours":["Who is hopping: a frog, a duckling, or a little fox on stepping stones?","What do you ride on: lily pads, logs, or friendly turtles?","What are the bonus things: dewdrops, berries, or stars?","How many lives or tries: unlimited, 5, or just 3 for a challenge?","What is waiting at the end: a frog party, a home log, or a trophy?"],"levelUp":["A level picker with ponds at morning, sunset and night","A two-player race on the same device, one frog per side of the screen","A pad designer where yo
